<style>

.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;max-height:260px;overflow:auto;padding:4px}.fieldGroup{border:1px solid var(--line);border-radius:10px;padding:9px;background:#fafbfc}.fieldGroupTitle{font-size:12px;font-weight:700;color:#475467;margin-bottom:7px}.fieldGroupBody{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px;cursor:pointer;user-select:none;background:#fff}.chip.on{background:#e7f2fb;border-color:#7fb5df}

<body>
<header><div><h1>Panasonic AC CSV Viewer</h1><div class="sub">本機讀取 CSV · 資料不會上傳 · HTML 不內含 CSV 資料</div></div></header>
<main>
<section id="loaderCard" class="card"><div id="drop" class="drop"><label class="btn" for="file">選擇 CSV</label> <button class="btn secondary" id="openCompare" type="button">雙檔比對</button><input id="file" type="file" accept=".csv,text/csv"><div style="margin-top:10px">或把 CSV 拖到這裡</div><div class="note">可處理大型 CSV；圖表會自動降採樣以維持流暢。</div></div><div class="progress hidden" id="progress"><div></div></div><div id="status" class="note"></div></section>
<section id="dashboard" class="hidden"><div class="mobileTabs"><button class="mobileTab on" data-tab="chart">圖表</button><button class="mobileTab" data-tab="compare">雙檔比對</button><button class="mobileTab" data-tab="fields">欄位</button><button class="mobileTab" data-tab="info">資訊</button><button class="mobileTab reloadTab" id="reloadMobile" type="button">重新載入</button></div>
<div class="card stats mobilePane" data-pane="info"><button class="btn secondary desktopReload" id="reloadDesktop" type="button">重新載入 CSV</button><div class="stat"><span>檔案</span><b id="sFile" style="font-size:13px;word-break:break-all">—</b></div><div class="stat"><span>有效資料列</span><b id="sRows">0</b></div><div class="stat"><span>欄位數</span><b id="sCols">0</b></div><div class="stat"><span>時間範圍</span><b id="sTime" style="font-size:13px">—</b></div></div>
<div class="card mobilePane fieldMobile" data-pane="fields"><div class="toolbar"><strong>圖表欄位</strong><button id="mobileFieldBtn" class="mobileFieldBtn" type="button"><span>數值欄位</span><small id="selectedCount">已選 0 項　›</small></button><select id="maxPoints"><option value="1000">1,000 點</option><option value="2500" selected>2,500 點</option><option value="5000">5,000 點</option><option value="10000">10,000 點</option></select><button class="btn" id="allOff">清除選取</button><button class="btn secondary" id="resetZoom">重設縮放</button></div><div id="fields" class="fields"></div><div id="mobileFieldList" class="mobileFieldList"></div></div>
<div class="card mobilePane" data-pane="compare"><div class="toolbar"><strong>雙檔比對</strong><button class="btn" id="pickA">載入 CSV A</button><button class="btn" id="pickB">載入 CSV B</button><input id="fileA" type="file" accept=".csv,text/csv"><input id="fileB" type="file" accept=".csv,text/csv"><span class="compareMsg">顯示名稱：</span><input id="compareNameA" class="compareNameInput" placeholder="CSV A（載入後可改名）" aria-label="CSV A 顯示名稱"><input id="compareNameB" class="compareNameInput" placeholder="CSV B（載入後可改名）" aria-label="CSV B 顯示名稱"><span id="compareNames" class="compareMsg hidden"></span></div><div id="compareRange" class="compareRange hidden"><div class="toolbar" style="margin-bottom:10px"><label>實際重疊區段 <select id="overlapPicker" style="max-width:100%;padding:7px;border:1px solid var(--line);border-radius:7px"></select></label></div><div class="toolbar"><b>共同時間區間</b><span id="commonRange"></span><label>起始 <input id="rangeStart" type="datetime-local" step="1"></label><label>結束 <input id="rangeEnd" type="datetime-local" step="1"></label><button class="btn" id="applyCompare">套用</button><button class="btn secondary" id="resetCompare">恢復共同區間</button></div><div id="compareFields" class="compareFields"></div></div><div id="compareStatus" class="note"></div><div id="compareGrid" class="compareGrid hidden"><div class="compareBox"><h3 id="titleA">CSV A</h3><canvas id="canvasA" class="compareCanvas"></canvas></div><div class="compareBox"><h3 id="titleB">CSV B</h3><canvas id="canvasB" class="compareCanvas"></canvas></div></div><div id="compareValues" class="pointPanel hidden"></div><div class="note">預設自動取兩份 CSV 的共同實際時間範圍；左右圖共用 X 軸、Y 軸與欄位。</div></div>
<div class="card mobilePane on" data-pane="chart"><div id="segmentBar" class="segmentBar hidden"><b>紀錄區段</b><select id="segmentSelect"></select></div><div class="chartWrap" id="chartWrap"><canvas id="chart"></canvas><div class="tooltip" id="tooltip"></div></div><div id="pointPanel" class="pointPanel hidden"><div id="pointTime" class="pointTime"></div><div id="pointValues" class="pointValues"></div></div><div class="note">點曲線或下方數值可強調該項；滾輪縮放、拖曳平移。</div></div>
</section></main><div id="sheetBackdrop" class="sheetBackdrop"></div><div id="fieldSheet" class="fieldSheet"><div class="sheetHead"><span>選擇數值欄位</span><button id="sheetDone" class="btn" type="button">完成</button></div><div id="sheetBody" class="sheetBody"></div></div>
<script>
const fileEl=document.getElementById('file'),drop=document.getElementById('drop'),loaderCard=document.getElementById('loaderCard'),statusEl=document.getElementById('status'),dash=document.getElementById('dashboard'),fieldsEl=document.getElementById('fields'),progress=document.getElementById('progress'),canvas=document.getElementById('chart'),pointPanel=document.getElementById('pointPanel'),pointTime=document.getElementById('pointTime'),pointValues=document.getElementById('pointValues'),mobileFieldBtn=document.getElementById('mobileFieldBtn'),selectedCount=document.getElementById('selectedCount'),fieldSheet=document.getElementById('fieldSheet'),sheetBackdrop=document.getElementById('sheetBackdrop'),sheetBody=document.getElementById('sheetBody'),mobileFieldList=document.getElementById('mobileFieldList'),segmentBar=document.getElementById('segmentBar'),segmentSelect=document.getElementById('segmentSelect');
let headers=[],rows=[],allRows=[],segments=[],selectedSegment=0,selected=new Set(),fileName='',firstTime='',lastTime='',sampleCache=[],sampleCacheKey='',renderPending=0,viewStart=0,viewEnd=1,lastPlot=null,dragStartX=null,dragViewStart=0,dragViewEnd=1,highlightKey=null;
const clean=s=>String(s??'').replace(/\0/g,'').trim(), num=v=>{v=clean(v);if(!v||v==='--')return null;let n=Number(v);return Number.isFinite(n)?n:null};
function parseTime(v){v=clean(v);if(!v)return NaN;let m=v.match(/(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})[ T](\d{1,2}):(\d{2})(?::(\d{2}))?/);return m?new Date(+m[1],+m[2]-1,+m[3],+m[4],+m[5],+(m[6]||0)).getTime():Date.parse(v)}
const excluded=h=>h==='記錄時間'||h==='運轉時間'||h.includes('故障代碼')||h==='運行模式';
function category(h){if(h.includes('溫度'))return '🌡️ 溫度';if(h.includes('送風馬達')||h.includes('壓縮機(周波數)')||h.includes('膨脹閥'))return '⚙️ 運轉元件';if(h.includes('電流')||h.includes('濕度'))return '⚡ 電流 / 濕度';if(h.includes('KType'))return '🧪 K-Type';return '📈 其他數值'}
function modeIcon(m){m=clean(m);if(!m)return '';if(m.includes('冷'))return '❄';if(m.includes('暖')||m.includes('熱'))return '☀';if(m.includes('除濕')||m.includes('乾'))return '💧';if(m.includes('送風')||m.includes('風'))return '◉';if(m.includes('自動'))return 'A';if(m.includes('停')||m==='OFF')return '■';return '●'}
function csvLine(s){let a=[],v='',q=false;for(let i=0;i<s.length;i++){let c=s[i];if(c==='"'){if(q&&s[i+1]==='"'){v+='"';i++}else q=!q}else if(c===','&&!q){a.push(v);v=''}else v+=c}a.push(v);return a}
['dragenter','dragover'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.add('drag')}));
['dragleave','drop'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.remove('drag')}));
drop.addEventListener('drop',e=>{let f=e.dataTransfer.files[0];if(f)load(f)});fileEl.onchange=()=>fileEl.files[0]&&load(fileEl.files[0]);
async function load(file){
 fileName=file.name;headers=[];rows=[];allRows=[];segments=[];selectedSegment=0;selected.clear();firstTime=lastTime='';dash.classList.add('hidden');progress.classList.remove('hidden');statusEl.textContent='解析中…';
 try{
  const reader=file.stream().getReader(),dec=new TextDecoder('utf-8'),maxKeep=200000;let buf='',bytes=0,lineNo=0,keepEvery=1;
  while(true){let {value,done}=await reader.read();if(done)break;bytes+=value.byteLength;buf+=dec.decode(value,{stream:true}).replace(/\0/g,'');let lines=buf.split(/\r?\n/);buf=lines.pop();
   for(const line of lines){if(!line)continue;let a=csvLine(line);if(!headers.length){headers=a.map(clean);continue}lineNo++;let ti=headers.indexOf('記錄時間'),t=ti>=0?clean(a[ti]):'';if(t){if(!firstTime)firstTime=t;lastTime=t}
    if(lineNo>maxKeep){keepEvery=Math.ceil(lineNo/maxKeep);if(lineNo%keepEvery)continue}let o={};headers.forEach((h,i)=>o[h]=clean(a[i]));rows.push(o);if(rows.length>maxKeep*1.2)rows=rows.filter((_,i)=>i%2===0);
   }
   let pct=Math.min(99,Math.round(bytes/file.size*100));progress.firstElementChild.style.width=pct+'%';statusEl.textContent='已讀取 '+pct+'% · 掃描 '+lineNo.toLocaleString()+' 列';await new Promise(r=>setTimeout(r,0));
  }
  progress.firstElementChild.style.width='100%';finish(lineNo);
 }catch(e){statusEl.textContent='讀取失敗：'+e.message;console.error(e)}
}
function finish(total){
 allRows=rows.slice();detectSegments();applySegment(0,false);
 document.getElementById('sFile').textContent=fileName;document.getElementById('sRows').textContent=total.toLocaleString();document.getElementById('sCols').textContent=headers.length;document.getElementById('sTime').textContent=(firstTime||'—')+(lastTime&&lastTime!==firstTime?' → '+lastTime:'');
 statusEl.textContent='完成 · 大型檔案已自動取樣顯示 · 資料未上傳';loaderCard.classList.add('hidden');dash.classList.remove('hidden');setTimeout(()=>progress.classList.add('hidden'),400);
 const numeric=headers.filter(h=>!excluded(h)&&rows.slice(0,500).some(r=>num(r[h])!==null));['(室內機)吸入溫度','(室內機)蒸發器溫度'].filter(x=>numeric.includes(x)).forEach(x=>selected.add(x));
 viewStart=0;viewEnd=1;fieldsEl.innerHTML='';sheetBody.innerHTML='';let groups={};numeric.forEach(h=>(groups[category(h)]??=[]).push(h));Object.entries(groups).forEach(([name,list],gi)=>{let g=document.createElement('details');g.className='fieldGroup';if(gi===0)g.open=true;let title=document.createElement('summary');title.className='fieldGroupTitle';title.textContent=name+' ('+list.length+')';let body=document.createElement('div');body.className='fieldGroupBody';let sg=document.createElement('div');sg.className='sheetGroup';sg.innerHTML='<div class=\"sheetGroupTitle\">'+name+'</div>';let so=document.createElement('div');so.className='sheetOptions';list.forEach(h=>{let d=document.createElement('div');d.className='chip'+(selected.has(h)?' on':'');d.textContent=h;d.onclick=()=>{selected.has(h)?selected.delete(h):selected.add(h);d.classList.toggle('on');syncFieldUI();scheduleRender()};body.appendChild(d);let lab=document.createElement('label');lab.className='sheetOption';let cb=document.createElement('input');cb.type='checkbox';cb.dataset.field=h;cb.checked=selected.has(h);cb.onchange=()=>{cb.checked?selected.add(h):selected.delete(h);syncFieldUI();scheduleRender()};let sp=document.createElement('span');sp.textContent=h;lab.append(cb,sp);so.appendChild(lab)});sg.appendChild(so);sheetBody.appendChild(sg);g.append(title,body);fieldsEl.appendChild(g)});mobileFieldList.innerHTML=sheetBody.innerHTML;mobileFieldList.querySelectorAll('input[data-field]').forEach(cb=>{cb.onchange=()=>{cb.checked?selected.add(cb.dataset.field):selected.delete(cb.dataset.field);syncFieldUI();scheduleRender()}});syncFieldUI();sampleCache=[];sampleCacheKey='';render();
}


function detectSegments(){segments=[];let timed=allRows.map((r,i)=>({i,t:parseTime(r['記錄時間'])})).filter(x=>Number.isFinite(x.t));if(timed.length<2){segments=[{start:0,end:allRows.length-1}];return}let gaps=[];for(let i=1;i<timed.length&&gaps.length<5000;i++){let d=timed[i].t-timed[i-1].t;if(d>0)gaps.push(d)}gaps.sort((a,b)=>a-b);let normal=gaps.length?gaps[Math.floor(gaps.length/2)]:1000,threshold=Math.max(normal*8,60000),start=0;for(let i=1;i<allRows.length;i++){let a=parseTime(allRows[i-1]['記錄時間']),b=parseTime(allRows[i]['記錄時間']);if(Number.isFinite(a)&&Number.isFinite(b)&&b-a>threshold){segments.push({start,end:i-1,gap:b-a});start=i}}segments.push({start,end:allRows.length-1});segmentSelect.innerHTML=segments.map((g,i)=>'<option value="'+i+'">紀錄 '+(i+1)+' · '+(allRows[g.start]?.['記錄時間']||'')+' ～ '+(allRows[g.end]?.['記錄時間']||'')+'</option>').join('');segmentBar.classList.toggle('hidden',segments.length<=1)}
function applySegment(i,redraw=true){selectedSegment=+i||0;let g=segments[selectedSegment]||{start:0,end:allRows.length-1};rows=allRows.slice(g.start,g.end+1);viewStart=0;viewEnd=1;sampleCache=[];sampleCacheKey='';pointPanel.classList.add('hidden');if(segmentSelect)segmentSelect.value=selectedSegment;if(redraw)scheduleRender()}
segmentSelect.onchange=()=>applySegment(segmentSelect.value);
function reloadFile(){fileEl.value='';fileEl.click()}
document.getElementById('reloadMobile').onclick=reloadFile;document.getElementById('reloadDesktop').onclick=reloadFile;
document.querySelectorAll('.mobileTab[data-tab]').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('.mobileTab').forEach(x=>x.classList.toggle('on',x===btn));document.querySelectorAll('.mobilePane').forEach(x=>x.classList.toggle('on',x.dataset.pane===btn.dataset.tab));if(btn.dataset.tab==='chart')setTimeout(scheduleRender,0)});
function syncFieldUI(){selectedCount.textContent='已選 '+selected.size+' 項　›';fieldsEl.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',selected.has(x.textContent)));sheetBody.querySelectorAll('input[data-field]').forEach(x=>x.checked=selected.has(x.dataset.field));mobileFieldList.querySelectorAll('input[data-field]').forEach(x=>x.checked=selected.has(x.dataset.field))}
function openFieldSheet(){fieldSheet.classList.add('open');sheetBackdrop.classList.add('open');document.body.style.overflow='hidden'}
function closeFieldSheet(){fieldSheet.classList.remove('open');sheetBackdrop.classList.remove('open');document.body.style.overflow=''}
mobileFieldBtn.onclick=openFieldSheet;sheetBackdrop.onclick=closeFieldSheet;document.getElementById('sheetDone').onclick=closeFieldSheet;
let compareData={A:null,B:null},compareSelected=new Set(),commonStart=0,commonEnd=0,compareStart=0,compareEnd=0,compareHighlight=null,overlapSegments=[];
function dtLocal(ms){let d=new Date(ms);return new Date(ms-d.getTimezoneOffset()*60000).toISOString().slice(0,19)}
async function readCompareCsv(file){
 const reader=file.stream().getReader(),dec=new TextDecoder('utf-8'),maxKeep=120000;let buf='',hs=null,ti=-1,rs=[],valid=0,firstT=Infinity,lastT=-Infinity;
 while(true){let z=await reader.read();if(z.done)break;buf+=dec.decode(z.value,{stream:true}).replace(/\0/g,'');let lines=buf.split(/\r?\n/);buf=lines.pop();for(const line of lines){if(!line)continue;let a=csvLine(line);if(!hs){hs=a.map(clean);ti=hs.indexOf('記錄時間');if(ti<0)throw Error('找不到「記錄時間」欄位');continue}let t=parseTime(clean(a[ti]));if(!Number.isFinite(t))continue;valid++;if(t<firstT)firstT=t;if(t>lastT)lastT=t;let o={__t:t};hs.forEach((h,i)=>o[h]=clean(a[i]));if(rs.length<maxKeep)rs.push(o);else if(valid%Math.ceil(valid/maxKeep)===0)rs.push(o);if(rs.length>maxKeep*1.15)rs=rs.filter((_,i)=>i%2===0)}await new Promise(r=>setTimeout(r,0))}
 if(!hs||!rs.length)throw Error('沒有可辨識的記錄時間');rs.sort((a,b)=>a.__t-b.__t);return {name:file.name,headers:hs,rows:rs,start:firstT,end:lastT,total:valid}
}
async function loadCompare(side,file){
 document.getElementById('compareStatus').textContent='正在讀取 CSV '+side+'…';
 try{compareData[side]=await readCompareCsv(file);document.getElementById('compareName'+side).value=file.name.replace(/\.csv$/i,'');updateCompareTitles();prepareCompare()}
 catch(e){document.getElementById('compareStatus').textContent='讀取失敗：'+e.message}
}
function recordSessions(data){
 const ts=data.rows.map(r=>r.__t),deltas=[];for(let i=1;i<ts.length;i++){let d=ts[i]-ts[i-1];if(d>0&&d<600000)deltas.push(d)}
 deltas.sort((a,b)=>a-b);const cadence=deltas.length?deltas[Math.floor(deltas.length/2)]:1000;
 const gap=Math.max(5000,Math.min(600000,cadence*5));let out=[],start=ts[0],prev=ts[0];
 for(let i=1;i<ts.length;i++){let t=ts[i];if(t-prev>gap){out.push({start,end:prev});start=t}prev=t}
 out.push({start,end:prev});return out
}
function actualOverlaps(A,B){
 let a=recordSessions(A),b=recordSessions(B),i=0,j=0,out=[];
 while(i<a.length&&j<b.length){let start=Math.max(a[i].start,b[j].start),end=Math.min(a[i].end,b[j].end);
 if(end>start)out.push({start,end});if(a[i].end<=b[j].end)i++;else j++}
 return out
}
function selectOverlap(index){

function compareGroup(h){let place=h.includes('室內機')?'室內機':h.includes('室外機')?'室外機':h.includes('KType')?'K-Type 外接感測': '其他';let kind=h.includes('溫度')?'溫度':h.includes('濕度')?'濕度':h.includes('送風馬達')||h.includes('風扇')?'風扇轉速':h.includes('周波數')||h.includes('週波數')||h.includes('頻率')?'壓縮機頻率':h.includes('膨脹閥')?'膨脹閥開度':h.includes('電流')?'電流':h.includes('壓力')?'壓力':'其他數值';return [place,kind]}

function prepareCompare(){
 let A=compareData.A,B=compareData.B;updateCompareTitles();if(!A||!B)return;
 overlapSegments=actualOverlaps(A,B);
 const picker=document.getElementById('overlapPicker');picker.replaceChildren();
 if(!overlapSegments.length){document.getElementById('compareStatus').textContent='兩份紀錄沒有實際連續重疊的時間區段（已排除中斷空檔）';document.getElementById('compareRange').classList.add('hidden');document.getElementById('compareGrid').classList.add('hidden');document.getElementById('compareValues').classList.add('hidden');return}
 overlapSegments.forEach((seg,i)=>{let o=document.createElement('option');o.value=i;o.textContent='區段 '+(i+1)+'｜'+new Date(seg.start).toLocaleString()+' ～ '+new Date(seg.end).toLocaleString()+'（'+Math.round((seg.end-seg.start)/60000)+' 分鐘）';picker.append(o)});
 picker.onchange=()=>selectOverlap(+picker.value);
 let longest=overlapSegments.reduce((best,seg,i)=>seg.end-seg.start>overlapSegments[best].end-overlapSegments[best].start?i:best,0);picker.value=String(longest);
 commonStart=overlapSegments[longest].start;commonEnd=overlapSegments[longest].end;
 compareStart=commonStart;compareEnd=commonEnd;comparePointTime=null;document.getElementById('compareValues').classList.add('hidden');document.getElementById('compareRange').classList.remove('hidden');document.getElementById('compareGrid').classList.remove('hidden');
 document.getElementById('commonRange').textContent=new Date(commonStart).toLocaleString()+' ～ '+new Date(commonEnd).toLocaleString();document.getElementById('rangeStart').value=dtLocal(commonStart);document.getElementById('rangeEnd').value=dtLocal(commonEnd);
 let common=A.headers.filter(h=>B.headers.includes(h)&&!excluded(h)&&A.rows.slice(0,500).some(r=>num(r[h])!==null)&&B.rows.slice(0,500).some(r=>num(r[h])!==null));
 compareSelected=new Set([...selected].filter(h=>common.includes(h)));if(!compareSelected.size)['(室內機)吸入溫度','(室內機)蒸發器溫度'].filter(h=>common.includes(h)).forEach(h=>compareSelected.add(h));
 let box=document.getElementById('compareFields');box.replaceChildren();const groups=new Map();for(const h of common){const [place,kind]=compareGroup(h);if(!groups.has(place))groups.set(place,new Map());if(!groups.get(place).has(kind))groups.get(place).set(kind,[]);groups.get(place).get(kind).push(h)}

}
function renderCompare(){
 let A=compareData.A,B=compareData.B;if(!A||!B||commonStart>=commonEnd)return;let ar=A.rows.filter(r=>r.__t>=compareStart&&r.__t<=compareEnd),br=B.rows.filter(r=>r.__t>=compareStart&&r.__t<=compareEnd),keys=[...compareSelected];
 let mn=Infinity,mx=-Infinity,count=0;[ar,br].forEach(rs=>keys.forEach(k=>rs.forEach(r=>{let v=num(r[k]);if(v!==null){if(v<mn)mn=v;if(v>mx)mx=v;count++}})));if(!count){document.getElementById('compareStatus').textContent='此區間沒有已選欄位的數值';return}if(mx===mn)mx=mn+1;

}
function drawCompare(c,rs,keys,mn,mx){
 let dpr=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;c.width=w*dpr;c.height=h*dpr;let x=c.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,w,h);let L=62,R=16,T=30,B=48,pw=w-L-R,ph=h-T-B,colors=['#1769aa','#d97706','#16803c','#9333ea','#dc2626','#0891b2','#4f46e5','#be185d'];
 x.font='11px sans-serif';for(let i=0;i<=5;i++){let y=T+ph*i/5,v=mx-(mx-mn)*i/5;x.strokeStyle='#e5e7eb';x.beginPath();x.moveTo(L,y);x.lineTo(w-R,y);x.stroke();x.fillStyle='#475467';x.textAlign='right';x.textBaseline='middle';x.fillText(v.toFixed(Math.abs(mx-mn)<10?2:1),L-7,y)}

}
document.getElementById('openCompare').onclick=()=>{loaderCard.classList.add('hidden');dash.classList.remove('hidden');document.querySelectorAll('.mobileTab').forEach(x=>x.classList.toggle('on',x.dataset.tab==='compare'));document.querySelectorAll('.mobilePane').forEach(x=>x.classList.toggle('on',x.dataset.pane==='compare'))};document.getElementById('pickA').onclick=()=>document.getElementById('fileA').click();document.getElementById('pickB').onclick=()=>document.getElementById('fileB').click();document.getElementById('fileA').onchange=e=>e.target.files[0]&&loadCompare('A',e.target.files[0]);document.getElementById('fileB').onchange=e=>e.target.files[0]&&loadCompare('B',e.target.files[0]);
document.getElementById('applyCompare').onclick=()=>{let s=new Date(document.getElementById('rangeStart').value).getTime(),e=new Date(document.getElementById('rangeEnd').value).getTime();if(!Number.isFinite(s)||!Number.isFinite(e)||s>=e){document.getElementById('compareStatus').textContent='起訖時間設定不正確';return}compareStart=Math.max(commonStart,s);compareEnd=Math.min(commonEnd,e);document.getElementById('rangeStart').value=dtLocal(compareStart);document.getElementById('rangeEnd').value=dtLocal(compareEnd);renderCompare()};

function render(){
 let max=+document.getElementById('maxPoints').value,key=rows.length+':'+max,base;if(sampleCacheKey===key){base=sampleCache}else{let step=Math.max(1,Math.ceil(rows.length/max));base=[];for(let i=0;i<rows.length;i+=step)base.push(rows[i]);sampleCache=base;sampleCacheKey=key}let a=Math.max(0,Math.floor(viewStart*(base.length-1))),b=Math.min(base.length,Math.ceil(viewEnd*(base.length-1))+1),data=base.slice(a,b);
 let ctx=canvas.getContext('2d'),dpr=devicePixelRatio||1,w=canvas.clientWidth,h=canvas.clientHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);

 let vals=[];keys.forEach(k=>data.forEach(r=>{let v=num(r[k]);if(v!==null)vals.push(v)}));if(!vals.length)return;let mn=Math.min(...vals),mx=Math.max(...vals);if(mx===mn)mx=mn+1;

 const colors=['#1769aa','#d97706','#16803c','#9333ea','#dc2626','#0891b2','#4f46e5','#be185d'];
 keys.forEach((k,ki)=>{ctx.save();ctx.globalAlpha=1;ctx.strokeStyle=highlightKey&&highlightKey!==k?'#d7dce2':colors[ki%colors.length];ctx.lineWidth=highlightKey===k?4.5:highlightKey?1:1.4;ctx.beginPath();let started=false;data.forEach((r,i)=>{let v=num(r[k]);if(v===null)return;let x=L+(data.length<2?0:i/(data.length-1))*pw,y=T+(mx-v)/(mx-mn)*ph;if(!started){ctx.moveTo(x,y);started=true}else ctx.lineTo(x,y)});ctx.stroke();ctx.restore()});
 ctx.fillStyle='#475467';ctx.textAlign='center';ctx.textBaseline='top';for(let j=0;j<=6;j++){let i=Math.round((data.length-1)*j/6),x=L+pw*j/6,s=(data[i]?.['記錄時間']||String(i));if(s.length>19)s=s.slice(0,19);ctx.strokeStyle='#98a2b3';ctx.beginPath();ctx.moveTo(x,T+ph);ctx.lineTo(x,T+ph+5);ctx.stroke();ctx.fillStyle='#475467';ctx.fillText(s,x,T+ph+9)}ctx.fillStyle='#344054';ctx.fillText(headers.includes('記錄時間')?'X 軸：記錄時間':'X 軸：資料序號',L+pw/2,h-16);
 ctx.textAlign='left';ctx.textBaseline='middle';let x=L,maxX=w-R;keys.slice(0,8).some((k,i)=>{let lim=w<700?8:18,label=k.length>lim?k.slice(0,lim)+'…':k,need=ctx.measureText(label).width+28;if(x+need>maxX)return true;ctx.fillStyle=colors[i%colors.length];ctx.fillRect(x,12,10,3);ctx.fillStyle='#17202a';ctx.fillText(label,x+14,14);x+=need;return false});if(headers.includes('運行模式')){let prev='',events=[];data.forEach((r,i)=>{let m=clean(r['運行模式']);if(!m||m==='0')return;if(!prev||m!==prev){events.push({i,m});prev=m}});ctx.font='12px sans-serif';ctx.textAlign='center';ctx.textBaseline='top';events.forEach(ev=>{let ex=L+(data.length<2?0:ev.i/(data.length-1))*pw;ctx.strokeStyle='#98a2b3';ctx.setLineDash([3,4]);ctx.beginPath();ctx.moveTo(ex,T);ctx.lineTo(ex,T+ph);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#fff';ctx.fillRect(ex-16,T+4,32,22);ctx.strokeStyle='#98a2b3';ctx.strokeRect(ex-16,T+4,32,22);ctx.fillStyle='#344054';ctx.fillText(modeIcon(ev.m),ex,T+7)});ctx.font='11px sans-serif'}
}
function scheduleRender(){cancelAnimationFrame(renderPending);renderPending=requestAnimationFrame(render)}
const tip=document.getElementById('tooltip'),wrap=document.getElementById('chartWrap');
function hideTip(){tip.style.display='none'}
function syncHighlightUI(){if(!lastPlot)return;pointValues.querySelectorAll('.pointValue').forEach(x=>{let k=lastPlot.keys[+x.dataset.idx],on=k===highlightKey;x.classList.toggle('active',on);x.classList.toggle('dim',!!highlightKey&&!on)})}function setHighlight(k){highlightKey=highlightKey===k?null:k;syncHighlightUI();scheduleRender()}
function selectPoint(clientX,clientY){if(!lastPlot)return;let p=lastPlot,r=canvas.getBoundingClientRect(),x=clientX-r.left,y=clientY==null?null:clientY-r.top;if(x<p.L||x>p.L+p.pw)return;let i=Math.max(0,Math.min(p.data.length-1,Math.round((x-p.L)/p.pw*(p.data.length-1)))),row=p.data[i],colors=['#1769aa','#d97706','#16803c','#9333ea','#dc2626','#0891b2','#4f46e5','#be185d'];if(y!==null&&y>=p.T&&y<=p.T+p.ph){let best=null,center=i,span=Math.max(2,Math.ceil(p.data.length*18/p.pw));p.keys.forEach(k=>{for(let j=Math.max(0,center-span);j<=Math.min(p.data.length-1,center+span);j++){let v=num(p.data[j][k]);if(v===null)continue;let px=p.L+(p.data.length<2?0:j/(p.data.length-1))*p.pw,py=p.T+(p.mx-v)/(p.mx-p.mn)*p.ph,d=Math.hypot((px-x)*0.7,py-y);if(!best||d<best.d)best={k,d}}});if(best&&best.d<=38){highlightKey=highlightKey===best.k?null:best.k;scheduleRender()}}pointTime.textContent='時間：'+(row['記錄時間']||('資料 #'+(i+1)));pointValues.innerHTML=p.keys.map((k,ki)=>{let v=num(row[k]),cls='pointValue'+(highlightKey===k?' active':highlightKey?' dim':'');return '<div class=\"'+cls+'\" data-idx=\"'+ki+'\"><span class=\"pointDot\" style=\"background:'+colors[ki%colors.length]+'\"></span><span>'+k+'：<b>'+(v===null?'—':v)+'</b></span></div>'}).join('');pointValues.querySelectorAll('.pointValue').forEach(el=>el.onclick=()=>setHighlight(p.keys[+el.dataset.idx]));pointPanel.classList.remove('hidden')}
function showPointAt(clientX,clientY,force=false){if(!lastPlot)return;let p=lastPlot,r=canvas.getBoundingClientRect(),x=clientX-r.left,y=clientY-r.top;if(x<p.L||x>p.L+p.pw||y<p.T||y>p.T+p.ph){hideTip();return}let i=Math.max(0,Math.min(p.data.length-1,Math.round((x-p.L)/p.pw*(p.data.length-1)))),row=p.data[i],best=null;p.keys.forEach(k=>{let v=num(row[k]);if(v===null)return;let py=p.T+(p.mx-v)/(p.mx-p.mn)*p.ph,d=Math.abs(py-y);if(!best||d<best.d)best={k,v,d,py}});if(!best||(!force&&best.d>24)){hideTip();return}let t=row['記錄時間']||('資料 #'+(i+1));tip.innerHTML='<b>'+best.k+'</b><br>時間：'+t+'<br>數值：<b>'+best.v+'</b>';tip.style.display='block';let left=Math.max(6,Math.min(wrap.clientWidth-tip.offsetWidth-6,x+12)),top=Math.max(6,Math.min(wrap.clientHeight-tip.offsetHeight-6,best.py-tip.offsetHeight-12));tip.style.left=left+'px';tip.style.top=top+'px'}

canvas.addEventListener('wheel',e=>{if(!lastPlot)return;e.preventDefault();hideTip();let r=canvas.getBoundingClientRect(),p=lastPlot,x=e.clientX-r.left;if(x<p.L||x>p.L+p.pw)return;let center=viewStart+(x-p.L)/p.pw*(viewEnd-viewStart),range=viewEnd-viewStart,f=e.deltaY<0?.8:1.25,nr=Math.min(1,Math.max(.01,range*f));viewStart=Math.max(0,center-(center-viewStart)/range*nr);viewEnd=Math.min(1,viewStart+nr);if(viewEnd-viewStart<nr)viewStart=Math.max(0,viewEnd-nr);scheduleRender()},{passive:false});

addEventListener('mousemove',e=>{if(dragStartX===null||!lastPlot)return;let dx=e.clientX-dragStartX,range=dragViewEnd-dragViewStart,shift=-dx/lastPlot.pw*range;viewStart=Math.max(0,Math.min(1-range,dragViewStart+shift));viewEnd=viewStart+range;scheduleRender()});
