<style>

*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Segoe UI",sans-serif;background:var(--bg);color:var(--text)}

.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;max-height:260px;overflow:auto;padding:4px}.fieldGroup{border:1px solid var(--line);border-radius:10px;padding:9px;background:#fafbfc}.fieldGroupTitle{font-size:12px;font-weight:700;color:#475467;margin-bottom:7px}.fieldGroupBody{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px;cursor:pointer;user-select:none;background:#fff}.chip.on{background:#e7f2fb;border-color:#7fb5df}
.chartWrap{height:520px;min-height:520px;max-height:520px;position:relative;overflow:hidden}.chartWrap canvas{display:block;width:100%;height:520px;cursor:crosshair}.tooltip{position:absolute;display:none;pointer-events:none;z-index:5;background:#101828e8;color:#fff;border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.55;box-shadow:0 4px 14px #0003;max-width:300px;white-space:nowrap}.progress{height:6px;background:#e9edf1;border-radius:4px;overflow:hidden;margin-top:10px}.progress>div{height:100%;background:var(--accent);width:0}
.mobileTabs,.mobileFieldList{display:none}.mobileFieldBtn,.sheetBackdrop,.fieldSheet{display:none}.segmentBar{display:flex;gap:8px;align-items:center;margin-bottom:10px}.segmentBar select{max-width:100%;padding:7px;border:1px solid var(--line);border-radius:8px;background:#fff}.note{font-size:12px;color:var(--muted);margin-top:8px}.hidden{display:none}.pointPanel{margin-top:8px;border:1px solid var(--line);border-radius:9px;padding:9px}.pointTime{font-weight:700;font-size:13px;margin-bottom:7px}.pointValues{display:flex;gap:6px 12px;flex-wrap:wrap}.pointValue{display:flex;align-items:center;gap:5px;font-size:12px}.pointDot{width:9px;height:9px;border-radius:50%;flex:none}
@media(max-width:700px){header{padding:10px 12px}h1{font-size:17px}.sub{font-size:10px}main{padding:6px}.card{padding:8px;margin-bottom:7px;border-radius:9px}.drop{padding:12px}.stats{grid-template-columns:1fr 1fr;gap:5px}.stat{padding:7px}.stat b{font-size:14px}.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:5px}.toolbar strong{display:none}.toolbar select,.toolbar .btn{width:100%;min-height:36px;padding:6px;font-size:12px}.fields{display:none}.mobileFieldBtn{display:flex;grid-column:1/-1;width:100%;height:42px;border:1px solid var(--line);border-radius:9px;background:#fff;align-items:center;justify-content:space-between;padding:0 12px;font-weight:700;color:#344054}.mobileFieldBtn small{font-weight:500;color:var(--muted)}.sheetBackdrop{position:fixed;inset:0;background:#0006;z-index:50}.sheetBackdrop.open{display:block}.fieldSheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:#fff;border-radius:16px 16px 0 0;max-height:82vh;transform:translateY(105%);transition:transform .2s ease;box-shadow:0 -8px 30px #0003}.fieldSheet.open{display:block;transform:translateY(0)}.sheetHead{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:700}.sheetBody{padding:8px 12px 16px;overflow-y:auto;max-height:calc(82vh - 58px)}.sheetGroup{padding:8px 0;border-bottom:1px solid #eef0f2}.sheetGroup:last-child{border-bottom:0}.sheetGroupTitle{font-size:12px;font-weight:700;color:#667085;margin-bottom:5px}.sheetOptions{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px}.sheetOption{display:flex;align-items:center;gap:7px;padding:7px 2px;font-size:12px;line-height:1.25}.sheetOption input{width:17px;height:17px;flex:none}.chartWrap{height:410px;min-height:410px;max-height:410px;margin:0 -2px;touch-action:none}.chartWrap canvas{height:410px;touch-action:none}.tooltip{font-size:12px;max-width:220px}.pointPanel{padding:8px}.pointValues{display:grid;grid-template-columns:1fr 1fr;gap:6px}.pointValue{font-size:11px;min-width:0}.note{line-height:1.4}.mobileTabs{display:grid;grid-template-columns:repeat(3,1fr);position:sticky;top:0;z-index:20;background:var(--bg);padding:2px 0 7px;gap:4px}.mobileTab{border:0;border-radius:8px;padding:9px 4px;background:#e9edf2;color:#475467;font-weight:700}.mobileTab.on{background:var(--accent);color:#fff}.mobilePane{display:none!important}.mobilePane.on{display:block!important}.mobilePane.card.on{display:block!important}.mobilePane.stats.on{display:grid!important}.sheetBackdrop,.fieldSheet,.mobileFieldBtn{display:none!important}.fieldMobile .fields{display:none}.fieldMobile .toolbar{display:grid}.fieldMobile #mobileFieldBtn{display:none!important}.fieldMobile .mobileFieldList{display:block}.sheetBody{overflow:visible;max-height:none;padding:4px 0}.sheetOptions{grid-template-columns:1fr 1fr}.segmentBar{font-size:12px;flex-wrap:wrap}.segmentBar select{width:100%}}

<body>
<header><div><h1>Panasonic AC CSV Viewer</h1><div class="sub">本機讀取 CSV · 資料不會上傳 · HTML 不內含 CSV 資料</div></div></header>
<main>
<section class="card"><div id="drop" class="drop"><label class="btn" for="file">選擇 CSV</label><input id="file" type="file" accept=".csv,text/csv"><div style="margin-top:10px">或把 CSV 拖到這裡</div><div class="note">可處理大型 CSV；圖表會自動降採樣以維持流暢。</div></div><div class="progress hidden" id="progress"><div></div></div><div id="status" class="note"></div></section>
<section id="dashboard" class="hidden"><div class="mobileTabs"><button class="mobileTab on" data-tab="chart">圖表</button><button class="mobileTab" data-tab="fields">欄位</button><button class="mobileTab" data-tab="info">資訊</button></div>
<div class="card stats mobilePane" data-pane="info"><div class="stat"><span>檔案</span><b id="sFile" style="font-size:13px;word-break:break-all">—</b></div><div class="stat"><span>有效資料列</span><b id="sRows">0</b></div><div class="stat"><span>欄位數</span><b id="sCols">0</b></div><div class="stat"><span>時間範圍</span><b id="sTime" style="font-size:13px">—</b></div></div>
<div class="card mobilePane fieldMobile" data-pane="fields"><div class="toolbar"><strong>圖表欄位</strong><button id="mobileFieldBtn" class="mobileFieldBtn" type="button"><span>數值欄位</span><small id="selectedCount">已選 0 項　›</small></button><select id="maxPoints"><option value="1000">1,000 點</option><option value="2500" selected>2,500 點</option><option value="5000">5,000 點</option><option value="10000">10,000 點</option></select><button class="btn" id="allOff">清除選取</button><button class="btn secondary" id="resetZoom">重設縮放</button></div><div id="fields" class="fields"></div><div id="mobileFieldList" class="mobileFieldList"></div></div>
<div class="card mobilePane on" data-pane="chart"><div id="segmentBar" class="segmentBar hidden"><b>紀錄區段</b><select id="segmentSelect"></select></div><div class="chartWrap" id="chartWrap"><canvas id="chart"></canvas><div class="tooltip" id="tooltip"></div></div><div id="pointPanel" class="pointPanel hidden"><div id="pointTime" class="pointTime"></div><div id="pointValues" class="pointValues"></div></div><div class="note">點選時間點可查看所有已選欄位。電腦：滾輪縮放、拖曳平移；手機：雙指縮放、放大後單指左右拖曳。</div></div>
</section></main><div id="sheetBackdrop" class="sheetBackdrop"></div><div id="fieldSheet" class="fieldSheet"><div class="sheetHead"><span>選擇數值欄位</span><button id="sheetDone" class="btn" type="button">完成</button></div><div id="sheetBody" class="sheetBody"></div></div>
<script>
const fileEl=document.getElementById('file'),drop=document.getElementById('drop'),statusEl=document.getElementById('status'),dash=document.getElementById('dashboard'),fieldsEl=document.getElementById('fields'),progress=document.getElementById('progress'),canvas=document.getElementById('chart'),pointPanel=document.getElementById('pointPanel'),pointTime=document.getElementById('pointTime'),pointValues=document.getElementById('pointValues'),mobileFieldBtn=document.getElementById('mobileFieldBtn'),selectedCount=document.getElementById('selectedCount'),fieldSheet=document.getElementById('fieldSheet'),sheetBackdrop=document.getElementById('sheetBackdrop'),sheetBody=document.getElementById('sheetBody'),mobileFieldList=document.getElementById('mobileFieldList'),segmentBar=document.getElementById('segmentBar'),segmentSelect=document.getElementById('segmentSelect');
let headers=[],rows=[],allRows=[],segments=[],selectedSegment=0,selected=new Set(),fileName='',firstTime='',lastTime='',sampleCache=[],sampleCacheKey='',renderPending=0,viewStart=0,viewEnd=1,lastPlot=null,dragStartX=null,dragViewStart=0,dragViewEnd=1;
const clean=s=>String(s??'').replace(/\0/g,'').trim(), num=v=>{v=clean(v);if(!v||v==='--')return null;let n=Number(v);return Number.isFinite(n)?n:null};
function parseTime(v){v=clean(v);if(!v)return NaN;let m=v.match(/(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})[ T](\d{1,2}):(\d{2})(?::(\d{2}))?/);return m?new Date(+m[1],+m[2]-1,+m[3],+m[4],+m[5],+(m[6]||0)).getTime():Date.parse(v)}
const excluded=h=>h==='記錄時間'||h==='運轉時間'||h.includes('故障代碼')||h==='運行模式';
function category(h){if(h.includes('溫度'))return '🌡️ 溫度';if(h.includes('送風馬達')||h.includes('壓縮機(周波數)')||h.includes('膨脹閥'))return '⚙️ 運轉元件';if(h.includes('電流')||h.includes('濕度'))return '⚡ 電流 / 濕度';if(h.includes('KType'))return '🧪 K-Type';return '📈 其他數值'}
function modeIcon(m){m=clean(m);if(!m)return '';if(m.includes('冷'))return '❄';if(m.includes('暖')||m.includes('熱'))return '☀';if(m.includes('除濕')||m.includes('乾'))return '💧';if(m.includes('送風')||m.includes('風'))return '◉';if(m.includes('自動'))return 'A';if(m.includes('停')||m==='OFF')return '■';return '●'}
function csvLine(s){let a=[],v='',q=false;for(let i=0;i<s.length;i++){let c=s[i];if(c==='"'){if(q&&s[i+1]==='"'){v+='"';i++}else q=!q}else if(c===','&&!q){a.push(v);v=''}else v+=c}a.push(v);return a}
['dragenter','dragover'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.add('drag')}));
['dragleave','drop'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.remove('drag')}));
drop.addEventListener('drop',e=>{let f=e.dataTransfer.files[0];if(f)load(f)});fileEl.onchange=()=>fileEl.files[0]&&load(fileEl.files[0]);
async function load(file){
 fileName=file.name;headers=[];rows=[];allRows=[];segments=[];selectedSegment=0;selected.clear();firstTime=lastTime='';dash.classList.add('hidden');progress.classList.remove('hidden');statusEl.textContent='解析中…';
 try{
  const reader=file.stream().getReader(),dec=new TextDecoder('utf-8'),maxKeep=200000;let buf='',bytes=0,lineNo=0,keepEvery=1;
  while(true){let {value,done}=await reader.read();if(done)break;bytes+=value.byteLength;buf+=dec.decode(value,{stream:true}).replace(/\0/g,'');let lines=buf.split(/\r?\n/);buf=lines.pop();
   for(const line of lines){if(!line)continue;let a=csvLine(line);if(!headers.length){headers=a.map(clean);continue}lineNo++;let ti=headers.indexOf('記錄時間'),t=ti>=0?clean(a[ti]):'';if(t){if(!firstTime)firstTime=t;lastTime=t}
    if(lineNo>maxKeep){keepEvery=Math.ceil(lineNo/maxKeep);if(lineNo%keepEvery)continue}let o={};headers.forEach((h,i)=>o[h]=clean(a[i]));rows.push(o);if(rows.length>maxKeep*1.2)rows=rows.filter((_,i)=>i%2===0);
   }
   let pct=Math.min(99,Math.round(bytes/file.size*100));progress.firstElementChild.style.width=pct+'%';statusEl.textContent='已讀取 '+pct+'% · 掃描 '+lineNo.toLocaleString()+' 列';await new Promise(r=>setTimeout(r,0));
  }
  progress.firstElementChild.style.width='100%';finish(lineNo);
 }catch(e){statusEl.textContent='讀取失敗：'+e.message;console.error(e)}
}
function finish(total){
 allRows=rows.slice();detectSegments();applySegment(0,false);
 document.getElementById('sFile').textContent=fileName;document.getElementById('sRows').textContent=total.toLocaleString();document.getElementById('sCols').textContent=headers.length;document.getElementById('sTime').textContent=(firstTime||'—')+(lastTime&&lastTime!==firstTime?' → '+lastTime:'');
 statusEl.textContent='完成 · 大型檔案已自動取樣顯示 · 資料未上傳';dash.classList.remove('hidden');setTimeout(()=>progress.classList.add('hidden'),400);
 const numeric=headers.filter(h=>!excluded(h)&&rows.slice(0,500).some(r=>num(r[h])!==null));['(室內機)吸入溫度','(室內機)蒸發器溫度'].filter(x=>numeric.includes(x)).forEach(x=>selected.add(x));
 viewStart=0;viewEnd=1;fieldsEl.innerHTML='';sheetBody.innerHTML='';let groups={};numeric.forEach(h=>(groups[category(h)]??=[]).push(h));Object.entries(groups).forEach(([name,list],gi)=>{let g=document.createElement('details');g.className='fieldGroup';if(gi===0)g.open=true;let title=document.createElement('summary');title.className='fieldGroupTitle';title.textContent=name+' ('+list.length+')';let body=document.createElement('div');body.className='fieldGroupBody';let sg=document.createElement('div');sg.className='sheetGroup';sg.innerHTML='<div class=\"sheetGroupTitle\">'+name+'</div>';let so=document.createElement('div');so.className='sheetOptions';list.forEach(h=>{let d=document.createElement('div');d.className='chip'+(selected.has(h)?' on':'');d.textContent=h;d.onclick=()=>{selected.has(h)?selected.delete(h):selected.add(h);d.classList.toggle('on');syncFieldUI();scheduleRender()};body.appendChild(d);let lab=document.createElement('label');lab.className='sheetOption';let cb=document.createElement('input');cb.type='checkbox';cb.dataset.field=h;cb.checked=selected.has(h);cb.onchange=()=>{cb.checked?selected.add(h):selected.delete(h);syncFieldUI();scheduleRender()};let sp=document.createElement('span');sp.textContent=h;lab.append(cb,sp);so.appendChild(lab)});sg.appendChild(so);sheetBody.appendChild(sg);g.append(title,body);fieldsEl.appendChild(g)});mobileFieldList.innerHTML=sheetBody.innerHTML;mobileFieldList.querySelectorAll('input[data-field]').forEach(cb=>{cb.onchange=()=>{cb.checked?selected.add(cb.dataset.field):selected.delete(cb.dataset.field);syncFieldUI();scheduleRender()}});syncFieldUI();sampleCache=[];sampleCacheKey='';render();
}


function detectSegments(){segments=[];let timed=allRows.map((r,i)=>({i,t:parseTime(r['記錄時間'])})).filter(x=>Number.isFinite(x.t));if(timed.length<2){segments=[{start:0,end:allRows.length-1}];return}let gaps=[];for(let i=1;i<timed.length&&gaps.length<5000;i++){let d=timed[i].t-timed[i-1].t;if(d>0)gaps.push(d)}gaps.sort((a,b)=>a-b);let normal=gaps.length?gaps[Math.floor(gaps.length/2)]:1000,threshold=Math.max(normal*8,60000),start=0;for(let i=1;i<allRows.length;i++){let a=parseTime(allRows[i-1]['記錄時間']),b=parseTime(allRows[i]['記錄時間']);if(Number.isFinite(a)&&Number.isFinite(b)&&b-a>threshold){segments.push({start,end:i-1,gap:b-a});start=i}}segments.push({start,end:allRows.length-1});segmentSelect.innerHTML=segments.map((g,i)=>'<option value="'+i+'">紀錄 '+(i+1)+' · '+(allRows[g.start]?.['記錄時間']||'')+' ～ '+(allRows[g.end]?.['記錄時間']||'')+'</option>').join('');segmentBar.classList.toggle('hidden',segments.length<=1)}
function applySegment(i,redraw=true){selectedSegment=+i||0;let g=segments[selectedSegment]||{start:0,end:allRows.length-1};rows=allRows.slice(g.start,g.end+1);viewStart=0;viewEnd=1;sampleCache=[];sampleCacheKey='';pointPanel.classList.add('hidden');if(segmentSelect)segmentSelect.value=selectedSegment;if(redraw)scheduleRender()}
segmentSelect.onchange=()=>applySegment(segmentSelect.value);
document.querySelectorAll('.mobileTab').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('.mobileTab').forEach(x=>x.classList.toggle('on',x===btn));document.querySelectorAll('.mobilePane').forEach(x=>x.classList.toggle('on',x.dataset.pane===btn.dataset.tab));if(btn.dataset.tab==='chart')setTimeout(scheduleRender,0)});
function syncFieldUI(){selectedCount.textContent='已選 '+selected.size+' 項　›';fieldsEl.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',selected.has(x.textContent)));sheetBody.querySelectorAll('input[data-field]').forEach(x=>x.checked=selected.has(x.dataset.field));mobileFieldList.querySelectorAll('input[data-field]').forEach(x=>x.checked=selected.has(x.dataset.field))}
function openFieldSheet(){fieldSheet.classList.add('open');sheetBackdrop.classList.add('open');document.body.style.overflow='hidden'}
function closeFieldSheet(){fieldSheet.classList.remove('open');sheetBackdrop.classList.remove('open');document.body.style.overflow=''}
mobileFieldBtn.onclick=openFieldSheet;sheetBackdrop.onclick=closeFieldSheet;document.getElementById('sheetDone').onclick=closeFieldSheet;
function render(){
 let max=+document.getElementById('maxPoints').value,key=rows.length+':'+max,base;if(sampleCacheKey===key){base=sampleCache}else{let step=Math.max(1,Math.ceil(rows.length/max));base=[];for(let i=0;i<rows.length;i+=step)base.push(rows[i]);sampleCache=base;sampleCacheKey=key}let a=Math.max(0,Math.floor(viewStart*(base.length-1))),b=Math.min(base.length,Math.ceil(viewEnd*(base.length-1))+1),data=base.slice(a,b);
 let ctx=canvas.getContext('2d'),dpr=devicePixelRatio||1,w=canvas.clientWidth,h=canvas.clientHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);
 let keys=[...selected];if(!keys.length){ctx.fillStyle='#667085';ctx.font='14px sans-serif';ctx.fillText('請選擇至少一個數值欄位',20,30);return}
 let vals=[];keys.forEach(k=>data.forEach(r=>{let v=num(r[k]);if(v!==null)vals.push(v)}));if(!vals.length)return;let mn=Math.min(...vals),mx=Math.max(...vals);if(mx===mn)mx=mn+1;
 let L=72,R=20,T=34,B=68,pw=w-L-R,ph=h-T-B;lastPlot={data,keys,L,R,T,B,pw,ph,w,h,mn,mx};ctx.font='11px sans-serif';ctx.textBaseline='middle';for(let i=0;i<=5;i++){let y=T+ph*i/5,v=mx-(mx-mn)*i/5;ctx.strokeStyle='#e5e7eb';ctx.beginPath();ctx.moveTo(L,y);ctx.lineTo(w-R,y);ctx.stroke();ctx.fillStyle='#475467';ctx.textAlign='right';ctx.fillText(v.toFixed(Math.abs(mx-mn)<10?2:1),L-9,y)}ctx.strokeStyle='#667085';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(L,T);ctx.lineTo(L,T+ph);ctx.lineTo(w-R,T+ph);ctx.stroke();ctx.save();ctx.translate(16,T+ph/2);ctx.rotate(-Math.PI/2);ctx.fillStyle='#344054';ctx.textAlign='center';ctx.fillText('Y 軸數值',0,0);ctx.restore();
 const colors=['#1769aa','#d97706','#16803c','#9333ea','#dc2626','#0891b2','#4f46e5','#be185d'];
 keys.forEach((k,ki)=>{ctx.strokeStyle=colors[ki%colors.length];ctx.lineWidth=1.4;ctx.beginPath();let started=false;data.forEach((r,i)=>{let v=num(r[k]);if(v===null)return;let x=L+(data.length<2?0:i/(data.length-1))*pw,y=T+(mx-v)/(mx-mn)*ph;if(!started){ctx.moveTo(x,y);started=true}else ctx.lineTo(x,y)});ctx.stroke()});
 ctx.fillStyle='#475467';ctx.textAlign='center';ctx.textBaseline='top';for(let j=0;j<=6;j++){let i=Math.round((data.length-1)*j/6),x=L+pw*j/6,s=(data[i]?.['記錄時間']||String(i));if(s.length>19)s=s.slice(0,19);ctx.strokeStyle='#98a2b3';ctx.beginPath();ctx.moveTo(x,T+ph);ctx.lineTo(x,T+ph+5);ctx.stroke();ctx.fillStyle='#475467';ctx.fillText(s,x,T+ph+9)}ctx.fillStyle='#344054';ctx.fillText(headers.includes('記錄時間')?'X 軸：記錄時間':'X 軸：資料序號',L+pw/2,h-16);
 ctx.textAlign='left';ctx.textBaseline='middle';let x=L,maxX=w-R;keys.slice(0,8).some((k,i)=>{let lim=w<700?8:18,label=k.length>lim?k.slice(0,lim)+'…':k,need=ctx.measureText(label).width+28;if(x+need>maxX)return true;ctx.fillStyle=colors[i%colors.length];ctx.fillRect(x,12,10,3);ctx.fillStyle='#17202a';ctx.fillText(label,x+14,14);x+=need;return false});if(headers.includes('運行模式')){let prev='',events=[];data.forEach((r,i)=>{let m=clean(r['運行模式']);if(!m||m==='0')return;if(!prev||m!==prev){events.push({i,m});prev=m}});ctx.font='12px sans-serif';ctx.textAlign='center';ctx.textBaseline='top';events.forEach(ev=>{let ex=L+(data.length<2?0:ev.i/(data.length-1))*pw;ctx.strokeStyle='#98a2b3';ctx.setLineDash([3,4]);ctx.beginPath();ctx.moveTo(ex,T);ctx.lineTo(ex,T+ph);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#fff';ctx.fillRect(ex-16,T+4,32,22);ctx.strokeStyle='#98a2b3';ctx.strokeRect(ex-16,T+4,32,22);ctx.fillStyle='#344054';ctx.fillText(modeIcon(ev.m),ex,T+7)});ctx.font='11px sans-serif'}
}
function scheduleRender(){cancelAnimationFrame(renderPending);renderPending=requestAnimationFrame(render)}
const tip=document.getElementById('tooltip'),wrap=document.getElementById('chartWrap');
function hideTip(){tip.style.display='none'}
function selectPoint(clientX){if(!lastPlot)return;let p=lastPlot,r=canvas.getBoundingClientRect(),x=clientX-r.left;if(x<p.L||x>p.L+p.pw)return;let i=Math.max(0,Math.min(p.data.length-1,Math.round((x-p.L)/p.pw*(p.data.length-1)))),row=p.data[i],colors=['#1769aa','#d97706','#16803c','#9333ea','#dc2626','#0891b2','#4f46e5','#be185d'];pointTime.textContent='時間：'+(row['記錄時間']||('資料 #'+(i+1)));pointValues.innerHTML=p.keys.map((k,ki)=>{let v=num(row[k]);return '<div class=\"pointValue\"><span class=\"pointDot\" style=\"background:'+colors[ki%colors.length]+'\"></span><span>'+k+'：<b>'+(v===null?'—':v)+'</b></span></div>'}).join('');pointPanel.classList.remove('hidden')}
function showPointAt(clientX,clientY,force=false){if(!lastPlot)return;let p=lastPlot,r=canvas.getBoundingClientRect(),x=clientX-r.left,y=clientY-r.top;if(x<p.L||x>p.L+p.pw||y<p.T||y>p.T+p.ph){hideTip();return}let i=Math.max(0,Math.min(p.data.length-1,Math.round((x-p.L)/p.pw*(p.data.length-1)))),row=p.data[i],best=null;p.keys.forEach(k=>{let v=num(row[k]);if(v===null)return;let py=p.T+(p.mx-v)/(p.mx-p.mn)*p.ph,d=Math.abs(py-y);if(!best||d<best.d)best={k,v,d,py}});if(!best||(!force&&best.d>24)){hideTip();return}let t=row['記錄時間']||('資料 #'+(i+1));tip.innerHTML='<b>'+best.k+'</b><br>時間：'+t+'<br>數值：<b>'+best.v+'</b>';tip.style.display='block';let left=Math.max(6,Math.min(wrap.clientWidth-tip.offsetWidth-6,x+12)),top=Math.max(6,Math.min(wrap.clientHeight-tip.offsetHeight-6,best.py-tip.offsetHeight-12));tip.style.left=left+'px';tip.style.top=top+'px'}
canvas.addEventListener('mousemove',e=>{if(dragStartX===null)showPointAt(e.clientX,e.clientY)});
canvas.addEventListener('mouseleave',hideTip);
canvas.addEventListener('click',e=>selectPoint(e.clientX));
canvas.addEventListener('wheel',e=>{if(!lastPlot)return;e.preventDefault();hideTip();let r=canvas.getBoundingClientRect(),p=lastPlot,x=e.clientX-r.left;if(x<p.L||x>p.L+p.pw)return;let center=viewStart+(x-p.L)/p.pw*(viewEnd-viewStart),range=viewEnd-viewStart,f=e.deltaY<0?.8:1.25,nr=Math.min(1,Math.max(.01,range*f));viewStart=Math.max(0,center-(center-viewStart)/range*nr);viewEnd=Math.min(1,viewStart+nr);if(viewEnd-viewStart<nr)viewStart=Math.max(0,viewEnd-nr);scheduleRender()},{passive:false});
canvas.addEventListener('mousedown',e=>{if(!lastPlot)return;dragStartX=e.clientX;dragViewStart=viewStart;dragViewEnd=viewEnd;canvas.style.cursor='grabbing';hideTip()});
addEventListener('mousemove',e=>{if(dragStartX===null||!lastPlot)return;let dx=e.clientX-dragStartX,range=dragViewEnd-dragViewStart,shift=-dx/lastPlot.pw*range;viewStart=Math.max(0,Math.min(1-range,dragViewStart+shift));viewEnd=viewStart+range;scheduleRender()});
addEventListener('mouseup',()=>{if(dragStartX!==null){dragStartX=null;canvas.style.cursor='crosshair'}});
let touchMode='',touchX=0,touchStartView=[0,1],pinchDist=0,pinchCenter=0,pinchRange=1;
const tdist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
canvas.addEventListener('touchstart',e=>{if(!lastPlot)return;e.preventDefault();if(e.touches.length===2){touchMode='pinch';pinchDist=tdist(e.touches);pinchRange=viewEnd-viewStart;let r=canvas.getBoundingClientRect(),cx=(e.touches[0].clientX+e.touches[1].clientX)/2-r.left;pinchCenter=viewStart+Math.max(0,Math.min(1,(cx-lastPlot.L)/lastPlot.pw))*pinchRange;hideTip()}else if(e.touches.length===1){touchMode='single';touchX=e.touches[0].clientX;touchStartView=[viewStart,viewEnd];showPointAt(e.touches[0].clientX,e.touches[0].clientY,true)}},{passive:false});
canvas.addEventListener('touchmove',e=>{if(!lastPlot)return;e.preventDefault();if(e.touches.length===2&&touchMode==='pinch'){let d=tdist(e.touches);if(!pinchDist)return;let nr=Math.max(.01,Math.min(1,pinchRange*pinchDist/d)),r=canvas.getBoundingClientRect(),cx=(e.touches[0].clientX+e.touches[1].clientX)/2-r.left,ratio=Math.max(0,Math.min(1,(cx-lastPlot.L)/lastPlot.pw));viewStart=Math.max(0,pinchCenter-ratio*nr);viewEnd=Math.min(1,viewStart+nr);if(viewEnd-viewStart<nr)viewStart=Math.max(0,viewEnd-nr);scheduleRender()}else if(e.touches.length===1&&touchMode==='single'){let dx=e.touches[0].clientX-touchX,range=touchStartView[1]-touchStartView[0];if(range<.999&&Math.abs(dx)>8){let shift=-dx/lastPlot.pw*range;viewStart=Math.max(0,Math.min(1-range,touchStartView[0]+shift));viewEnd=viewStart+range;hideTip();scheduleRender()}else showPointAt(e.touches[0].clientX,e.touches[0].clientY,true)}},{passive:false});
canvas.addEventListener('touchend',e=>{if(e.touches.length===0){if(touchMode==='single')selectPoint(touchX);touchMode='';}else if(e.touches.length===1){touchMode='single';touchX=e.touches[0].clientX;touchStartView=[viewStart,viewEnd]}},{passive:false});
document.getElementById('resetZoom').onclick=()=>{viewStart=0;viewEnd=1;hideTip();scheduleRender()};
document.getElementById('maxPoints').onchange=()=>{sampleCache=[];sampleCacheKey='';scheduleRender()};document.getElementById('allOff').onclick=()=>{selected.clear();syncFieldUI();scheduleRender()};let resizeTimer;addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>rows.length&&render(),120)});
</script></body></html>
