<script>
/* ============================================================
===== Firebase/Firestore/Auth 配置 =====
============================================================ */
const firebaseConfig = {
    apiKey: "AIzaSyD17BCkojSaGiuGzubNGMg-HKGJn5il79o",
    authDomain: "kennote-58073.firebaseapp.com",
    projectId: "kennote-58073",
    appId: "1:1000941899656:web:5c2f62f428b9609520743d",
};

/* ★★★ 換成你部署 Apps Script 後拿到的網址（.../exec 結尾）★★★ */
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwwq5slnsJWqOpx0HeUoSNmKoPYK8Rrp0Z8_9SU8Ikmtg5BlaRH0V3zKZqCVbmEQYjC1A/exec";

let auth = null;
let db = null;
let currentUserID = null;
let editingId = null;
let currentFilter = "";
let calendarMonth = new Date();
calendarMonth.setDate(1);
let noteDateSet = new Set();
let allUserNotesCache = []; 

const app = firebase.initializeApp(firebaseConfig);
auth = firebase.auth();
db = firebase.firestore();

function isAppsScriptConfigured() {
    return !!APPS_SCRIPT_URL && !APPS_SCRIPT_URL.includes("YOUR_");
}

/* =============================
    Google Calendar 橋接（透過 Apps Script，不再需要前端 OAuth popup）
============================= */
async function syncToGoogleCalendar(noteData, gcalEventId = null) {
    if (!isAppsScriptConfigured()) return null;

    const fullDateTime = `${noteData.date}T${noteData.time || '09:00'}:00`;
    const start = new Date(fullDateTime);
    const end = new Date(start.getTime() + 60 * 60 * 1000);

    const payload = {
        action: 'upsert',
        id: gcalEventId || null,
        title: noteData.title || "(無標題)",
        content: noteData.content || "",
        start: start.toISOString(),
        end: end.toISOString()
    };

    try {
        // 用 text/plain 送出，避免瀏覽器對 Apps Script 發出 CORS preflight（OPTIONS）
        const response = await fetch(APPS_SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload)
        });
        const data = await response.json();
        if (data.error) {
            console.error("Apps Script 同步錯誤:", data.error);
            return null;
        }
        return data.id || null;
    } catch (e) {
        console.error("同步至 Google Calendar 失敗:", e);
        return null;
    }
}

async function deleteFromGoogleCalendar(gcalEventId) {
    if (!isAppsScriptConfigured() || !gcalEventId) return;

    try {
        const response = await fetch(APPS_SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'delete', id: gcalEventId })
        });
        const data = await response.json();
        if (data.error) {
            console.error("從 Google Calendar 刪除失敗:", data.error);
        }
    } catch (e) {
        console.error("從 Google Calendar 刪除例外錯誤:", e);
    }
}

async function pullFromGoogleCalendar(dateStr, isManual = false) {
    if (!currentUserID) return;

    if (!isAppsScriptConfigured()) {
        if (isManual) alert("尚未設定 Apps Script 網址，請先在程式碼中填入 APPS_SCRIPT_URL。");
        return false;
    }

    const baseDate = new Date(dateStr);
    const y = baseDate.getFullYear();
    const m = baseDate.getMonth();
    const startDate = new Date(y, m - 1, 1);
    const endDate = new Date(y, m + 2, 0, 23, 59, 59);

    const timeMin = startDate.toISOString();
    const timeMax = endDate.toISOString();

    try {
        const url = `${APPS_SCRIPT_URL}?action=list&timeMin=${encodeURIComponent(timeMin)}&timeMax=${encodeURIComponent(timeMax)}`;
        const response = await fetch(url);
        const data = await response.json();

        if (data.error) {
            console.error("同步拉取失敗:", data.error);
            if (isManual) alert("同步失敗：" + data.error);
            return false;
        }

        const gcalEvents = data.items || [];

        const startStr = formatDate(startDate);
        const endStr = formatDate(endDate);
        const localNotes = allUserNotesCache.filter(n => n.date >= startStr && n.date <= endStr);
        
        let hasChanges = false;
        const validGcalIds = new Set();
        const batchPromises = []; 

        for (const event of gcalEvents) {
            if (event.status === 'cancelled') continue; 
            validGcalIds.add(event.id);

            const existingNote = localNotes.find(n => n.gcal_event_id === event.id);
            const eventTitle = event.summary || "(無標題)";
            const eventContent = event.description || "";
            
            let eventDateStr = dateStr;
            let newTime = "00:00";
            
            if (event.start) {
                if (event.start.dateTime) {
                    const d = new Date(event.start.dateTime);
                    eventDateStr = formatDate(d);
                    newTime = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
                } else if (event.start.date) {
                    eventDateStr = event.start.date;
                }
            }

            if (existingNote) {
                if (existingNote.title !== eventTitle || existingNote.content !== eventContent || existingNote.time !== newTime || existingNote.date !== eventDateStr) {
                    batchPromises.push(db.collection("users").doc(currentUserID).collection("notes").doc(existingNote.id).update({
                        title: eventTitle,
                        content: eventContent,
                        time: newTime,
                        date: eventDateStr
                    }));
                    hasChanges = true;
                }
            } else {
                batchPromises.push(db.collection("users").doc(currentUserID).collection("notes").add({
                    title: eventTitle,
                    content: eventContent,
                    date: eventDateStr,
                    time: newTime,
                    category: "", 
                    done_date: null,
                    gcal_event_id: event.id
                }));
                hasChanges = true;
            }
        }

        for (const localNote of localNotes) {
            if (localNote.gcal_event_id && !validGcalIds.has(localNote.gcal_event_id)) {
                batchPromises.push(db.collection("users").doc(currentUserID).collection("notes").doc(localNote.id).delete());
                hasChanges = true;
            }
        }

        if (hasChanges) {
            if (batchPromises.length > 0) await Promise.all(batchPromises);
            await fetchAllNotesForCache(); 
            const updatedNotes = allUserNotesCache.filter(n => n.date === dateStr);
            renderNotes(updatedNotes); 
        }
        return true;
    } catch (e) {
        console.error("同步拉取失敗:", e);
        if (isManual) alert("同步失敗：" + e.message);
        return false;
    }
}

/* =============================
    身份驗證 (Authentication)
============================= */
auth.onAuthStateChanged(async (user) => {
    const loginScreen = document.getElementById("loginScreen");
    const appContent = document.getElementById("appContent");

    if (user) {
        currentUserID = user.uid;
        loginScreen.style.display = "none";
        appContent.style.display = "flex"; 

        const today = formatDate(new Date());
        setCurrentDateStr(today);

        await fetchAllNotesForCache(); 
        loadNotesForCurrentDate();
    } else {
        currentUserID = null;
        loginScreen.style.display = "flex";
        appContent.style.display = "none";
        
        document.getElementById("noteList").innerHTML = '';
        allUserNotesCache = [];
    }
});

document.getElementById("btnGoogleSignIn").onclick = async function() {
    this.disabled = true;
    this.style.opacity = "0.5";
    this.innerHTML = "登入中...";

    // 只需要一般登入權限；日曆存取改由 Apps Script（你自己帳號）代為執行，
    // 前端不再需要 calendar.events 這個額外 scope，也就不會再跳日曆授權窗。
    const provider = new firebase.auth.GoogleAuthProvider();
    
    try {
        await auth.signInWithPopup(provider);
    } catch (error) {
        if (error.code !== 'auth/popup-closed-by-user' && error.code !== 'auth/cancelled-popup-request') {
            console.error("登入失敗", error);
            alert("登入失敗：" + error.message);
        }
    } finally {
        this.disabled = false;
        this.style.opacity = "1";
        this.innerHTML = `<img src="icon/google.png" alt="Google 登入" style="width: 20px; height: 20px; vertical-align: middle; margin-right: 8px;"> Google 登入`;
    }
};

document.getElementById("btnLogout").onclick = () => {
    auth.signOut();
};

/* =============================
    Firestore CRUD
============================= */
function loadNotesForCurrentDate() {
    if (!currentUserID) return;
    const targetDate = getCurrentDateStr();
    
    const notesToday = allUserNotesCache.filter(n => n.date === targetDate);
    renderNotes(notesToday);
    // 🚫 移除自動 pullFromGoogleCalendar 避免時間差造成的誤刪
}

async function fetchAllNotesForCache() {
    if (!currentUserID) return;
    try {
        const snapshot = await db.collection("users").doc(currentUserID).collection("notes").get();
        allUserNotesCache = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));

        noteDateSet.clear();
        allUserNotesCache.forEach(n => {
            if (n.date) noteDateSet.add(n.date);
        });
        renderCalendar(); 
        return allUserNotesCache;
    } catch (e) {
        console.error("Error fetching documents: ", e);
        return [];
    }
}

async function saveNoteToDB(note, docId = null) {
    if (!currentUserID) return;
    const noteRef = db.collection("users").doc(currentUserID).collection("notes");
        
    let newNoteData = { ...note };
    delete newNoteData.id;
    
    Object.keys(newNoteData).forEach(key => {
        if (newNoteData[key] === undefined) delete newNoteData[key];
    });

    try {
        if (docId) {
            await noteRef.doc(docId).update(newNoteData);
        } else {
            await noteRef.add(newNoteData);
        }
        await fetchAllNotesForCache();
        loadNotesForCurrentDate();
    } catch (e) {
        console.error("Error saving document: ", e);
        alert("資料庫儲存失敗：" + e.message);
    }
}

async function deleteNote(id) {
    if (!currentUserID) return;
    try {
        if (confirm("確定刪除這筆記事？")) {
            const noteToDelete = allUserNotesCache.find(n => n.id === id);
            if (noteToDelete && noteToDelete.gcal_event_id) {
                await deleteFromGoogleCalendar(noteToDelete.gcal_event_id);
            }
            await db.collection("users").doc(currentUserID).collection("notes").doc(id).delete();
            await fetchAllNotesForCache(); 
            loadNotesForCurrentDate();
        }
    } catch (e) {
        console.error("Error deleting document: ", e);
        alert("刪除失敗：" + e.message);
    }
}

async function markNoteDone(id, done_date) {
    if (!currentUserID) return;
    try {
        await db.collection("users").doc(currentUserID).collection("notes").doc(id).update({
            done_date: done_date,
            order_index: firebase.firestore.FieldValue.delete()
        });
        await fetchAllNotesForCache(); 
        loadNotesForCurrentDate();
    } catch (e) {
        console.error("Error updating done status: ", e);
    }
}

async function moveNoteToDate(noteId, newDate) {
    if (!currentUserID) return;
    try {
        const noteToMove = allUserNotesCache.find(n => n.id === noteId);
        
        let updateData = {
            date: newDate,
            done_date: null,
            order_index: firebase.firestore.FieldValue.delete()
        };

        if (noteToMove) {
            const tempNote = { ...noteToMove, date: newDate };
            await syncToGoogleCalendar(tempNote, noteToMove.gcal_event_id);
        }

        await db.collection("users").doc(currentUserID).collection("notes").doc(noteId).update(updateData);
        await fetchAllNotesForCache();
        loadNotesForCurrentDate();
        return true;
    } catch (e) {
        console.error("Error moving note: ", e);
        return false;
    }
}

async function copyNoteToDate(originalNote, newDate) {
    if (!currentUserID) return;
    const newNote = {
        date: newDate,
        time: originalNote.time || "09:00",
        title: originalNote.title,
        content: originalNote.content,
        category: originalNote.category,
        done_date: null,
    };
    
    try {
        const savedGcalId = await syncToGoogleCalendar(newNote);
        if (savedGcalId) newNote.gcal_event_id = savedGcalId;

        await db.collection("users").doc(currentUserID).collection("notes").add(newNote);
        await fetchAllNotesForCache();
        loadNotesForCurrentDate();
        return true;
    } catch (e) {
        console.error("Error copying note: ", e);
        return false;
    }
}

async function saveNoteOrder(id, index) {
    if (!currentUserID) return;
    try {
        await db.collection("users").doc(currentUserID).collection("notes").doc(id).update({ order_index: index });
    } catch(e) {
        console.error("Error saving order: ", e);
    }
}

/* ================================================================= 
    工具函數、渲染、事件
=================================================================*/
function truncateTitle(title) {  return title.length > 10 ? title.slice(0, 10) + "…" : title;}     
function formatDate(date) {  const y = date.getFullYear();  const m = String(date.getMonth() + 1).padStart(2, "0");  const d = String(date.getDate()).padStart(2, "0");  return `${y}-${m}-${d}`;}   
function formatTime(date) {  const h = String(date.getHours()).padStart(2, "0");  const m = String(date.getMinutes()).padStart(2, "0");  const s = String(date.getSeconds()).padStart(2, "0");  return `${h}:${m}:${s}`;}    
function formatDateTime(date) {  return `${formatDate(date)} ${formatTime(date)}`;}

function getCurrentDateStr() {  return document.getElementById("currentDate").value;}
function setCurrentDateStr(str) {  document.getElementById("currentDate").value = str;  document.getElementById("currentDateText").textContent = str;}

const CATEGORIES = ["", "私人", "工作"];

function getCategoryColor(category) {
    const colors = { "": "#ffffff", "私人": "#8B5E34", "工作": "#4A5568", "學習": "#9C27B0" };
    return colors[category] || "#1b1b1b"; 
}

function getCategoryTextColor(category) {
    if (category === "") return "#1b1b1b";
    return "white";
}

function renderCategoryTags(currentCategory) {
    const container = document.getElementById("noteCategoryTags");
    if (!container) return;
    container.innerHTML = ''; 

    CATEGORIES.forEach(category => {
        const btn = document.createElement("button");
        btn.textContent = category || "不分類"; 
        btn.className = "nt-btn tag-btn"; 
        btn.dataset.category = category;

        const defaultBg = "#ffffff";
        const defaultText = "#1b1b1b";
        const categoryBg = getCategoryColor(category);
        const categoryText = getCategoryTextColor(category);

        const applyDefaultStyle = (element) => {
            element.style.backgroundColor = defaultBg;
            element.style.color = defaultText;
            element.style.border = '1px solid #E2E8F0';
            element.style.opacity = '1';
            element.style.transition = '0.2s';
            element.style.outline = 'none';
        };

        const applyActiveStyle = (element) => {
            element.style.backgroundColor = categoryBg;
            element.style.color = categoryText;
            element.style.outline = `2px solid ${categoryText}`; 
        }
        
        const applyHoverStyle = (element, cat) => {
            if (cat === "") {
                element.style.backgroundColor = '#1b1b1b';
                element.style.color = 'white';
                element.style.border = '1px solid #1b1b1b';
            } else {
                element.style.backgroundColor = categoryBg;
                element.style.color = categoryText;
                element.style.border = `1px solid ${categoryBg}`;
            }
        }

        applyDefaultStyle(btn);

        if (category === currentCategory) {
            btn.classList.add("active");
            applyActiveStyle(btn);
        } 
        
        btn.onmouseenter = () => { if (!btn.classList.contains('active')) applyHoverStyle(btn, category); };
        btn.onmouseleave = () => { if (!btn.classList.contains('active')) applyDefaultStyle(btn); else applyActiveStyle(btn); };

        btn.onclick = (e) => {
            e.preventDefault(); 
            container.querySelectorAll('.tag-btn').forEach(b => {
                b.classList.remove('active');
                applyDefaultStyle(b);
            });
            btn.classList.add('active');
            applyActiveStyle(btn);
        };
        container.appendChild(btn);
    });
}

function renderNotes(notesArr) {
    if (currentFilter) {
        notesArr = notesArr.filter(n => n.category === currentFilter);
    }
    const listEl = document.getElementById("noteList");
    listEl.innerHTML = ""; 

    const fragment = document.createDocumentFragment();
    const undone = notesArr.filter(n => !n.done_date);
    const done   = notesArr.filter(n => n.done_date);

    undone.sort((a, b) => (a.order_index ?? 99999) - (b.order_index ?? 99999));

    ([...undone, ...done]).forEach(note => {
        const item = document.createElement("div");
        item.className = "note-item";
        if (note.done_date) item.classList.add("completed"); 
        item.dataset.id = note.id; 

        const isDone = !!note.done_date;
        const doneTagHtml = isDone ? `<span class="done-date">✔ ${note.done_date}</span>` : '';
            
        const bgColor = getCategoryColor(note.category);
        const textColor = getCategoryTextColor(note.category);
        
        const categoryTagHtml = note.category 
            ? `<div class="note-category-tag" style="background:${bgColor}; color: ${textColor};">${note.category}</div>` 
            : '';
        
        const noteForCopy = JSON.stringify(note).replace(/"/g, '&quot;');
        
        item.innerHTML = `
            <input type="checkbox" class="note-checkbox" data-note-id="${note.id}" ${isDone ? 'checked' : ''}>
            <div class="note-title">
                <span class="title-text ${isDone ? 'done' : ''}">${truncateTitle(note.title || "(無標題)")}</span>
                <span style="font-size: 0.8em; color: #888; margin-left: 5px;">${note.time || ''}</span>
                ${doneTagHtml}
            </div>
            ${categoryTagHtml}
            <div class="note-actions">
                <button class="nt-btn icon-btn" title="點擊選擇要搬移的日期" onclick="event.stopPropagation(); startMoveMode('${note.id}')">
                    <img src="icon/move.png" alt="move">
                </button>
                <button class="nt-btn icon-btn" title="點擊選擇要複製的日期" onclick="event.stopPropagation(); startCopyMode('${noteForCopy}')">
                    <img src="icon/copy.png" alt="copy">
                </button>
                <button class="nt-btn nt-danger icon-btn" ondblclick="event.stopPropagation(); deleteNote('${note.id}')">
                    <img src="icon/round.png" alt="刪除">
                </button>
            </div>
        `;
        
        const chk = item.querySelector(".note-checkbox");
        if (chk) {
            chk.addEventListener('click', (ev) => {
                ev.stopPropagation();
                const doneDate = chk.checked ? formatDateTime(new Date()) : null;
                markNoteDone(note.id, doneDate);
            });
        }

        const titleEl = item.querySelector(".note-title");
        if(titleEl) {
             titleEl.addEventListener('click', () => openNoteModal(note));
        }

        fragment.appendChild(item);
    });
    
    listEl.appendChild(fragment);
    initSortable(); 
}

function openNoteModal(note) {
    editingId = note ? note.id : null;
    document.getElementById("noteModalHeader").textContent = note ? "編輯記事" : "新增記事";
    document.getElementById("noteTitleInput").value = note?.title || "";
    document.getElementById("noteContentInput").value = note?.content || "";
    
    document.getElementById("noteDateInput").value = note?.date || getCurrentDateStr();
    document.getElementById("noteTimeInput").value = note?.time || "09:00";
    
    renderCategoryTags(note?.category || "");

    document.querySelectorAll(".modal-field-label").forEach(el => el.style.display = "");
    document.getElementById("noteTitleInput").style.display = "";
    document.getElementById("noteContentInput").style.display = "";
    document.querySelector(".datetime-container").style.display = "flex";
    document.getElementById("noteModalSave").style.display = "";
    document.querySelector(".modal-field-row-new").style.display = "flex"; 
    document.getElementById("noteCategoryTags").style.display = "flex";

    const oldRow = document.querySelector(".modal-field-row");
    if (oldRow) oldRow.style.display = "none";
    
    const sr = document.getElementById("searchResultArea");
    if (sr) sr.remove(); 

    document.getElementById("noteModal").style.display = "flex";
}

function closeNoteModal() {
    document.getElementById("noteModal").style.display = "none";
}

async function handleSaveNote() {
    const title = document.getElementById("noteTitleInput").value.trim();
    const content = document.getElementById("noteContentInput").value.trim();
    const dateStr = document.getElementById("noteDateInput").value;
    const timeStr = document.getElementById("noteTimeInput").value;
    
    const activeTag = document.querySelector("#noteCategoryTags .active");
    const category = activeTag ? activeTag.dataset.category : "";

    if (!title || !dateStr) {
        alert("請至少填寫標題與日期！");
        return;
    }

    const noteData = { 
        date: dateStr, 
        time: timeStr,
        title, 
        content, 
        category,
        done_date: null 
    };

    let oldGcalId = null;
    if (editingId) {
        const oldNote = allUserNotesCache.find(n => n.id === editingId);
        if (oldNote) {
            noteData.done_date = oldNote.done_date || null; 
            noteData.order_index = oldNote.order_index;
            oldGcalId = oldNote.gcal_event_id || null;
        }
    }

    // 日曆同步交給 Apps Script，失敗也不擋住儲存（純粹本地記事仍然可用）
    const savedGcalId = await syncToGoogleCalendar(noteData, oldGcalId);
    if (savedGcalId) {
        noteData.gcal_event_id = savedGcalId; 
    }

    await saveNoteToDB(noteData, editingId);
    closeNoteModal();
}

/* =============================   月曆相關與跨月事件綁定 ============================= */
function reapplyMoveCopyHandlers() {
    const cells = document.querySelectorAll("#calendarGrid .calendar-cell");
    cells.forEach(cell => {
        if (targetNoteForCopy) {
            cell.style.cursor = "copy";
            cell.onclick = async function () {
                const newDate = this.dataset.date;
                await copyNoteToDate(targetNoteForCopy, newDate);
                targetNoteForCopy = null;
                closeCalendarModal();
                removeMoveHint();
                if (newDate === getCurrentDateStr()) loadNotesForCurrentDate();
            };
        } else if (targetNoteForMove) {
            cell.style.cursor = "pointer";
            cell.onclick = async function () {
                const newDate = this.dataset.date;
                await moveNoteToDate(targetNoteForMove.id, newDate);
                targetNoteForMove = null;
                closeCalendarModal();
                removeMoveHint();
            };
        }
    });
}

function buildTagBubblesHtml(dateStr) {
    const notesOfDay = allUserNotesCache.filter(n => n.date === dateStr && !n.done_date);
    if (notesOfDay.length === 0) return '';

    const grouped = {};
    let hasUncategorized = false;
    notesOfDay.forEach(n => {
        if (n.category) {
            if (!grouped[n.category]) grouped[n.category] = [];
            grouped[n.category].push(n);
        } else {
            hasUncategorized = true;
        }
    });

    let html = hasUncategorized ? '<div class="calendar-dot"></div>' : '';

    Object.keys(grouped).forEach(cat => {
        const notesInCat = grouped[cat];
        const bg = getCategoryColor(cat);
        const color = getCategoryTextColor(cat);
        let label = notesInCat.length === 1 ? (notesInCat[0].title || cat) : `${cat}×${notesInCat.length}`;
        if (label.length > 6 && notesInCat.length === 1) label = label.slice(0, 6) + "…";
        
        html += `<div class="note-category-tag" style="position:static;display:block;max-width:92%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;box-sizing:border-box;background:${bg};color:${color};margin-top:2px;">${label}</div>`;
    });

    return html;
}

function renderCalendar() {
    const grid = document.getElementById("calendarGrid");
    grid.innerHTML = "";

    const year = calendarMonth.getFullYear();
    const month = calendarMonth.getMonth();
    document.getElementById("calTitle").textContent = `${year} 年 ${month + 1} 月`;

    const firstDay = new Date(year, month, 1);
    const firstWeekday = firstDay.getDay();
    const nextMonthFirst = new Date(year, month + 1, 1);
    const daysInMonth = new Date(nextMonthFirst - 1).getDate();
    const daysInPrevMonth = new Date(year, month, 0).getDate();

    const selectedDateStr = getCurrentDateStr();
    const todayStr = formatDate(new Date());

    for (let i = 0; i < 42; i++) {
        const cell = document.createElement("div");
        cell.className = "calendar-cell";
        const inner = document.createElement("div");
        inner.className = "calendar-cell-inner";

        let dateNum, offset;
        if (i < firstWeekday) {
            dateNum = daysInPrevMonth - firstWeekday + 1 + i;
            offset = -1;
            cell.classList.add("other-month");
        } else if (i >= firstWeekday + daysInMonth) {
            dateNum = i - (firstWeekday + daysInMonth) + 1;
            offset = 1;
            cell.classList.add("other-month");
        } else {
            dateNum = i - firstWeekday + 1;
            offset = 0;
        }

        const cellDate = new Date(year, month + offset, dateNum);
        const cellDateStr = formatDate(cellDate);

        inner.innerHTML = `<div class="calendar-cell-num">${dateNum}</div>`;
        if (cellDateStr === todayStr) cell.classList.add("today");
        if (noteDateSet.has(cellDateStr)) cell.classList.add("has-note");

        inner.innerHTML += buildTagBubblesHtml(cellDateStr);
        if (cellDateStr === selectedDateStr) cell.classList.add("selected");

        cell.dataset.date = cellDateStr;
        cell.onclick = () => {
            setCurrentDateStr(cellDateStr);
            loadNotesForCurrentDate();
            closeCalendarModal();
        };

        cell.appendChild(inner);
        grid.appendChild(cell);
    }
    
    if (targetNoteForMove || targetNoteForCopy) {
        reapplyMoveCopyHandlers();
    }
}

function openCalendarModal() {
    document.getElementById("calendarModal").style.display = "flex";
    renderCalendar();
}
function closeCalendarModal() {
    document.getElementById("calendarModal").style.display = "none";
}
function shiftCalendarMonth(offset) {
    calendarMonth.setMonth(calendarMonth.getMonth() + offset);
    renderCalendar();
}

window.onload = () => {
    const logoBox = document.querySelector('.logo-box');
    if (logoBox) {
        logoBox.style.cursor = 'pointer';
        logoBox.onclick = async () => {
            if (!currentUserID) return;
            logoBox.style.opacity = '0.3';

            const targetDate = getCurrentDateStr();
            await pullFromGoogleCalendar(targetDate, true);
            
            setTimeout(() => { logoBox.style.opacity = '1'; }, 300);
        };
    }

    document.querySelectorAll("#filterBar button").forEach(btn => {
        btn.onclick = () => {
            currentFilter = btn.dataset.filter; 
            document.querySelectorAll("#filterBar button").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            loadNotesForCurrentDate(); 
        };
    });
    
    document.getElementById("dateBar").onclick = openCalendarModal;
    document.getElementById("calPrev").onclick = () => shiftCalendarMonth(-1);
    document.getElementById("calNext").onclick = () => shiftCalendarMonth(1);
    document.getElementById("btnAdd").onclick = () => openNoteModal(null);
    document.getElementById("noteModalCancel").onclick = closeNoteModal;
    document.getElementById("noteModalSave").onclick = handleSaveNote;
    
    document.getElementById("btnPrevDay").onclick = (e) => {
        e.stopPropagation();
        const cur = new Date(getCurrentDateStr());
        cur.setDate(cur.getDate() - 1);
        setCurrentDateStr(formatDate(cur));
        loadNotesForCurrentDate();
    };

    document.getElementById("btnNextDay").onclick = (e) => {
        e.stopPropagation();
        const cur = new Date(getCurrentDateStr());
        cur.setDate(cur.getDate() + 1);
        setCurrentDateStr(formatDate(cur));
        loadNotesForCurrentDate();
    };  
    
    document.getElementById("btnToday").onclick = (ev) => {
        ev.stopPropagation();          
        const today = formatDate(new Date());
        setCurrentDateStr(today);
        loadNotesForCurrentDate();      
    };
    
    document.getElementById("btnMoveUndoneToToday").onclick = async () => {
        if (!currentUserID) return alert("請先登入");

        const targetDate = getCurrentDateStr();
        const todayStr = formatDate(new Date());

        if (targetDate === todayStr) return alert("目前已經是今日的記事囉！");

        const undoneElements = document.querySelectorAll("#noteList .note-item:not(.completed)");
        if (undoneElements.length === 0) return alert("畫面上沒有未完成的項目可移動！");

        if (!confirm(`確定要將畫面上 ${undoneElements.length} 個未完成項目延至今日 (${todayStr}) 嗎？`)) return;

        // ✅ 不再需要在迴圈裡逐一取得 OAuth token，Apps Script 用自己的授權處理，
        //    所以這裡可以安心平行送出，不會再跳出多個登入視窗。
        const movePromises = Array.from(undoneElements).map(async (el) => {
            const id = el.dataset.id;
            const noteToMove = allUserNotesCache.find(n => n.id === id);
            
            if (noteToMove) {
                const tempNote = { ...noteToMove, date: todayStr };
                await syncToGoogleCalendar(tempNote, noteToMove.gcal_event_id);
            }

            return db.collection("users").doc(currentUserID).collection("notes").doc(id).update({
                date: todayStr,
                order_index: firebase.firestore.FieldValue.delete() 
            });
        });

        try {
            await Promise.all(movePromises);  
            await fetchAllNotesForCache();    
            loadNotesForCurrentDate();        
        } catch (e) {
            console.error("Error batch moving notes to today: ", e);
            alert("移動失敗：" + e.message);
        }
    };

    ["calendarModal"].forEach(id => {
        const modal = document.getElementById(id);
        if (modal) {
            modal.addEventListener("click", (ev) => {
                if (ev.target === modal) {
                    const sr = document.getElementById("searchResultArea");
                    if (sr) sr.remove();

                    document.querySelectorAll(".modal-field-label").forEach(el => el.style.display = "");
                    document.querySelector(".modal-field-row-new").style.display = "flex";
                    document.getElementById("noteTitleInput").style.display = "";
                    document.getElementById("noteContentInput").style.display = "";
                    document.querySelector(".datetime-container").style.display = "flex";
                    document.getElementById("noteModalSave").style.display = "";
                    document.getElementById("noteCategoryTags").style.display = "flex";
                    
                    const oldRow = document.querySelector(".modal-field-row");
                    if (oldRow) oldRow.style.display = "none";

                    modal.style.display = "none";
                }
            });
        }
    });
};

document.getElementById("btnSearch").onclick = async () => {
    if (!currentUserID) return alert("請先登入");
    const kw = prompt("請輸入搜尋關鍵字：");
    if (!kw) return;

    const notes = allUserNotesCache;
    const keyword = kw.toLowerCase(); 
    
    const searchResults = notes.filter(note => {
        const title = (note.title || "").toLowerCase();
        const content = (note.content || "").toLowerCase();
        return title.includes(keyword) || content.includes(keyword);
    });

    if (searchResults.length === 0) return alert("查無資料！");

    const rows = searchResults.map(n => [
        n.id, n.date, n.title, n.content, n.done_date 
    ]);
    showSearchResults(rows);
};

function showSearchResults(rows) {
    const modal = document.getElementById("noteModal");
    modal.style.display = "flex";

    const existingArea = document.getElementById("searchResultArea");
    if (existingArea) existingArea.remove();

    document.getElementById("noteModalHeader").textContent = `搜尋結果（${rows.length}筆）`;

    document.querySelectorAll(".modal-field-label").forEach(el => el.style.display = "none");
    document.getElementById("noteTitleInput").style.display = "none";
    document.getElementById("noteContentInput").style.display = "none";
    document.querySelector(".datetime-container").style.display = "none";
    document.getElementById("noteModalSave").style.display = "none";
    document.querySelector(".modal-field-row-new").style.display = "none"; 
    document.getElementById("noteCategoryTags").style.display = "none";

    const tempArea = document.createElement("div");
    tempArea.id = "searchResultArea";
    tempArea.style.maxHeight = "60vh";
    tempArea.style.overflowY = "auto";
    
    tempArea.innerHTML = `
        <style>
            .search-table { width:100%; border-collapse:separate; border-spacing: 0 8px; }
            .search-table th { font-weight: bold; color: #A0AEC0; padding: 12px 15px; text-align: left; border-bottom: 2px solid #E2E8F0; position: sticky; top: 0; background-color: #fff; z-index: 10; }
            .search-row { cursor: pointer; background-color: #F7FAFC; transition: background-color 0.2s; border-radius: 8px; overflow: hidden; }
            .search-row:hover { background-color: #EDF2F7; }
            .search-row td { padding: 10px 15px; border-top: 1px solid #E2E8F0; }
            .search-row:first-child td { border-top: none; }
            .search-row.completed-row { opacity: 0.6; }
            .search-title { font-weight: 500; }
            .search-date { font-size: 0.9em; color: #4A5568; }
            .search-done { color: #38A169; font-weight: bold; text-align: center; }
        </style>
        <table class="search-table">
            <thead>
                <tr><th>日期</th><th>標題</th><th style="width: 50px; text-align: center;">完成</th></tr>
            </thead>
            <tbody>
                ${rows.map(r => {
                    const id = r[0]; const date = r[1]; const title = r[2] || '(無標題)'; const isDone = r[4]; 
                    return `
                        <tr class="search-row ${isDone ? 'completed-row' : ''}" data-id="${id}">
                            <td class="search-date">${date}</td>
                            <td class="search-title">${truncateTitle(title)}</td>
                            <td class="search-done">${isDone ? '✔' : ''}</td>
                        </tr>
                    `;
                }).join('')}
            </tbody>
        </table>
    `;

    const modalContent = document.querySelector(".modal-content");
    const modalFooter = document.querySelector(".modal-footer");
    modalContent.insertBefore(tempArea, modalFooter);

    document.querySelectorAll(".search-row").forEach(tr => {
        tr.onclick = () => {
            const id = tr.dataset.id;
            openEditFromSearch(id);
        };
    });
}

function openEditFromSearch(id) {
    const note = allUserNotesCache.find(n => n.id === id);
    if (note) {
        const sr = document.getElementById("searchResultArea");
        if (sr) sr.remove();

        document.querySelectorAll(".modal-field-label").forEach(el => el.style.display = "");
        document.querySelector(".modal-field-row-new").style.display = "flex";
        document.getElementById("noteTitleInput").style.display = "";
        document.getElementById("noteContentInput").style.display = "";
        document.querySelector(".datetime-container").style.display = "flex";
        document.getElementById("noteModalSave").style.display = "";
        document.getElementById("noteCategoryTags").style.display = "flex";

        openNoteModal(note);    
    }
}

let sortable = null;
function initSortable() {
    const list = document.getElementById("noteList");
    if (sortable && typeof sortable.destroy === 'function') sortable.destroy(); 

    sortable = new Sortable(list, {
        animation: 150,
        ghostClass: "dragging",
        filter: ".completed",
        preventOnFilter: false,
        handle: ".note-category-tag",
        
        onEnd: async function (evt) { 
            if (evt.oldIndex === evt.newIndex) return;
            const undoneItems = Array.from(list.children).filter(el => !el.classList.contains("completed"));
            const updatePromises = undoneItems.map((el, index) => {
                const id = el.dataset.id;
                return saveNoteOrder(id, index); 
            });
            await Promise.all(updatePromises);
            await fetchAllNotesForCache(); 
            loadNotesForCurrentDate();
        }
    });
}

let targetNoteForMove = null;
let targetNoteForCopy = null;

function removeMoveHint() {
    const hint = document.getElementById("moveHint");
    if (hint) hint.remove();
}

function startCopyMode(noteString) {
    try {
        targetNoteForCopy = JSON.parse(noteString.replace(/&quot;/g, '"'));
    } catch (e) {
        return;
    }
    targetNoteForMove = null;
    removeMoveHint();
    openCalendarModal();

    const hint = document.createElement("div");
    hint.id = "moveHint";
    hint.textContent = "請選擇要複製到的日期";
    hint.style.cssText = `position:fixed;top:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.92);color:#fff;padding:12px 22px;border-radius:30px;z-index:9999;font-size:15px;pointer-events:none;box-shadow:0 4px 20px rgba(0,0,0,0.4);`;
    document.body.appendChild(hint);
    reapplyMoveCopyHandlers();
}    

function startMoveMode(noteId) {
    targetNoteForMove = { id: noteId };
    targetNoteForCopy = null;
    removeMoveHint();
    openCalendarModal();

    const hint = document.createElement("div");
    hint.id = "moveHint";
    hint.textContent = "請選擇要搬移的日期";
    hint.style.cssText = `position:fixed;top:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.92);color:#fff;padding:12px 22px;border-radius:30px;z-index:9999;font-size:15px;pointer-events:none;box-shadow:0 4px 20px rgba(0,0,0,0.4);`;
    document.body.appendChild(hint);
    reapplyMoveCopyHandlers();
}

const originalClose = closeCalendarModal;
closeCalendarModal = function () {
    const inMoveOrCopyMode = targetNoteForMove || targetNoteForCopy;
    originalClose(); 
    if (inMoveOrCopyMode) {
        targetNoteForMove = null;
        targetNoteForCopy = null;
        removeMoveHint();
        renderCalendar();
    }
};
