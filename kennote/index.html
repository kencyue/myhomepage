<script>
/* ============================================================
===== Firebase/Firestore/Auth 配置及資料庫替換邏輯 (V9 Compat) =====
============================================================
*/
// 🔥 您的 Firebase 專案配置 
const firebaseConfig = {
    apiKey: "AIzaSyD17BCkojSaGiuGzubNGMg-HKGJn5il79o",
    authDomain: "kennote-58073.firebaseapp.com",
    projectId: "kennote-58073",
    appId: "1:1000941899656:web:5c2f62f428b9609520743d",
};

// ⚠️ 請填入你的 Google OAuth 2.0 用戶端 ID（見本檔案結尾說明如何取得）
// 這個 ID 用於 Google Identity Services 的 Calendar 授權/刷新，與 Firebase 登入是分開的機制。
const GCAL_CLIENT_ID = "1000941899656-oflihbktud17k23hj4ds9q482pnt5t0e.apps.googleusercontent.com";

// 是否只匯入「由 Kennote 建立」的 Google 日曆行程（預設 true，避免把使用者主要日曆裡
// 所有既有的會議、行程都灌進 Kennote）。如果你希望「直接在 Google 日曆新增的行程」
// 也自動出現在 Kennote，把這個改成 false —— 但請注意這會把過去 90 天~未來 365 天內
// 主要日曆的所有行程都當成筆記匯入。
const ONLY_IMPORT_KENNOTE_EVENTS = true;

const SYNC_INTERVAL_MS = 3 * 60 * 1000; // 背景輪詢間隔：3 分鐘

// 全域變數
let auth = null;
let db = null;
let currentUserID = null;
let editingId = null;
let currentFilter = "";
let calendarMonth = new Date();
calendarMonth.setDate(1);
let noteDateSet = new Set();
let allUserNotesCache = []; 

// GCal 同步相關全域變數
let tokenClient = null;
let gisReady = false;
let isSyncing = false;
let syncIntervalId = null;

// 初始化 Firebase
const app = firebase.initializeApp(firebaseConfig);
auth = firebase.auth();
db = firebase.firestore();

/* =============================
    Google 日曆授權（Google Identity Services）
    取代原本「登入當下拿一次 access token，之後永不刷新」的作法。
============================= */
function initGisTokenClient() {
    if (typeof google === 'undefined' || !google.accounts || !google.accounts.oauth2) {
        console.warn("Google Identity Services 尚未載入，稍後會再嘗試。");
        setTimeout(initGisTokenClient, 500);
        return;
    }
    tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: GCAL_CLIENT_ID,
        scope: 'https://www.googleapis.com/auth/calendar.events',
        callback: () => {} // 實際 callback 由 ensureGcalToken() 動態覆寫
    });
    gisReady = true;
}

// 取得可用的 access token：
// - 若 sessionStorage 內的 token 還沒過期（保留 1 分鐘緩衝），直接回傳。
// - 否則嘗試用 GIS 取得新 token：interactive=false 時是「靜默」嘗試（不保證成功，
//   常見失敗原因是瀏覽器封鎖第三方 cookie／iframe）；interactive=true 會跳出 Google 同意視窗。
function ensureGcalToken(interactive) {
    return new Promise((resolve) => {
        const expiry = Number(sessionStorage.getItem('gcal_token_expiry') || 0);
        const token = sessionStorage.getItem('gcal_token');
        if (token && Date.now() < expiry - 60000) {
            resolve(token);
            return;
        }
        if (!gisReady || !tokenClient) {
            resolve(null);
            return;
        }

        let settled = false;
        const timeoutId = setTimeout(() => {
            if (!settled) { settled = true; resolve(null); }
        }, 8000);

        tokenClient.callback = (resp) => {
            if (settled) return;
            settled = true;
            clearTimeout(timeoutId);
            if (resp && resp.access_token) {
                sessionStorage.setItem('gcal_token', resp.access_token);
                const exp = Date.now() + (Number(resp.expires_in || 3600) * 1000);
                sessionStorage.setItem('gcal_token_expiry', String(exp));
                hideSyncBanner();
                resolve(resp.access_token);
            } else {
                resolve(null);
            }
        };
        tokenClient.error_callback = () => {
            if (settled) return;
            settled = true;
            clearTimeout(timeoutId);
            resolve(null);
        };

        try {
            tokenClient.requestAccessToken({ prompt: interactive ? 'consent' : '' });
        } catch (e) {
            settled = true;
            clearTimeout(timeoutId);
            resolve(null);
        }
    });
}

// 明顯的同步狀態提示（取代原本只印在 console 的靜默失敗）
function showSyncBanner(message, actionLabel, actionFn) {
    let banner = document.getElementById("syncBanner");
    if (!banner) {
        banner = document.createElement("div");
        banner.id = "syncBanner";
        banner.style.cssText = "position:fixed;top:0;left:0;right:0;background:#C05621;color:#fff;padding:10px 16px;text-align:center;font-size:14px;z-index:10000;display:flex;justify-content:center;align-items:center;gap:12px;box-shadow:0 2px 8px rgba(0,0,0,0.2);";
        document.body.prepend(banner);
    }
    banner.innerHTML = "";
    const text = document.createElement("span");
    text.textContent = message;
    banner.appendChild(text);
    if (actionLabel && actionFn) {
        const btn = document.createElement("button");
        btn.textContent = actionLabel;
        btn.style.cssText = "background:#fff;color:#C05621;border:none;border-radius:6px;padding:4px 12px;cursor:pointer;font-weight:bold;";
        btn.onclick = actionFn;
        banner.appendChild(btn);
    }
}
function hideSyncBanner() {
    const banner = document.getElementById("syncBanner");
    if (banner) banner.remove();
}

function startPeriodicSync() {
    stopPeriodicSync();
    syncIntervalId = setInterval(() => pullFromGoogleCalendar(false), SYNC_INTERVAL_MS);
}
function stopPeriodicSync() {
    if (syncIntervalId) { clearInterval(syncIntervalId); syncIntervalId = null; }
}

/* =============================
    寫入 Google Calendar（含全天／時段兩種事件）
============================= */
async function syncToGoogleCalendar(noteData, gcalEventId = null) {
    const token = await ensureGcalToken(false);
    if (!token) {
        showSyncBanner("Google 日曆尚未連接或授權已過期，這筆記事暫時不會同步", "重新連接", () => ensureGcalToken(true));
        return null;
    }

    const event = {
        summary: noteData.title || "(無標題)",
        description: noteData.content || "",
        status: "confirmed",          // 標示行程已確認
        transparency: "transparent",  // 設為「有空」(不忙碌)
        extendedProperties: { private: { kennote: "1" } } // 標記為 Kennote 建立，供拉取時辨識
    };

    if (noteData.allDay === false && noteData.startTime) {
        const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
        event.start = { dateTime: `${noteData.date}T${noteData.startTime}:00`, timeZone: tz };
        event.end = { dateTime: `${noteData.date}T${noteData.endTime || noteData.startTime}:00`, timeZone: tz };
    } else {
        // Google Calendar 官方定義「全天行程」的結束日期是隔天
        const d = new Date(noteData.date);
        d.setDate(d.getDate() + 1);
        const endDateStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        event.start = { date: noteData.date };
        event.end = { date: endDateStr };
    }

    const baseUrl = 'https://www.googleapis.com/calendar/v3/calendars/primary/events';
    let url = baseUrl;
    let method = 'POST';

    if (gcalEventId) {
        url = `${baseUrl}/${gcalEventId}`;
        method = 'PUT';
    }

    try {
        const response = await fetch(url, {
            method: method,
            headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(event)
        });

        if (!response.ok) {
            if (response.status === 401) {
                sessionStorage.removeItem('gcal_token');
                sessionStorage.removeItem('gcal_token_expiry');
                showSyncBanner("Google 日曆授權已過期，這筆記事尚未同步", "重新連接", () => ensureGcalToken(true));
            } else if (response.status === 404 && gcalEventId) {
                // 對應的 Google 事件已在日曆端被刪除，改為新建一筆，避免卡死
                return syncToGoogleCalendar(noteData, null);
            } else {
                showSyncBanner("同步至 Google 日曆失敗，稍後會自動重試", null, null);
            }
            return null;
        }

        const data = await response.json();
        return { id: data.id, updated: data.updated }; // updated 用於雙向同步時判斷「回音」
    } catch (e) {
        console.error("同步至 Google Calendar 失敗:", e);
        showSyncBanner("同步至 Google 日曆時發生網路錯誤", null, null);
        return null;
    }
}

async function deleteFromGoogleCalendar(gcalEventId) {
    const token = await ensureGcalToken(false);
    if (!token || !gcalEventId) return;

    try {
        await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events/${gcalEventId}`, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${token}` }
        });
    } catch (e) {
        console.error("從 Google Calendar 刪除失敗:", e);
    }
}

/* =============================
    從 Google Calendar 拉取變更（雙向同步的「讀」半邊）
    用 syncToken 做增量同步；沒有 token（第一次）或 token 失效(410) 時做全量同步。
============================= */
async function getStoredSyncToken() {
    if (!currentUserID) return null;
    try {
        const doc = await db.collection("users").doc(currentUserID).get();
        return doc.exists ? (doc.data().gcalSyncToken || null) : null;
    } catch (e) {
        console.error("讀取同步權杖失敗:", e);
        return null;
    }
}

async function storeSyncToken(token) {
    if (!currentUserID) return;
    try {
        if (token) {
            await db.collection("users").doc(currentUserID).set({ gcalSyncToken: token }, { merge: true });
        } else {
            await db.collection("users").doc(currentUserID).set({ gcalSyncToken: firebase.firestore.FieldValue.delete() }, { merge: true });
        }
    } catch (e) {
        console.error("儲存同步權杖失敗:", e);
    }
}

function mapGcalEventToNote(ev) {
    if (!ev.start) return null;
    if (ev.start.date) {
        return {
            date: ev.start.date,
            title: ev.summary || "",
            content: ev.description || "",
            allDay: true,
            startTime: null,
            endTime: null
        };
    }
    if (ev.start.dateTime) {
        const startD = new Date(ev.start.dateTime);
        const endD = ev.end && ev.end.dateTime ? new Date(ev.end.dateTime) : null;
        return {
            date: formatDate(startD),
            title: ev.summary || "",
            content: ev.description || "",
            allDay: false,
            startTime: formatHM(startD),
            endTime: endD ? formatHM(endD) : formatHM(startD)
        };
    }
    return null;
}

async function applyPulledEvents(events) {
    if (!events || events.length === 0 || !currentUserID) return;

    const notesRef = db.collection("users").doc(currentUserID).collection("notes");
    const ops = [];

    for (const ev of events) {
        const existing = allUserNotesCache.find(n => n.gcal_event_id === ev.id);

        if (ev.status === 'cancelled') {
            // 行程在 Google 日曆端被刪除 → 同步刪除對應筆記
            if (existing) ops.push(notesRef.doc(existing.id).delete());
            continue;
        }

        const isKennoteEvent = !!(ev.extendedProperties && ev.extendedProperties.private && ev.extendedProperties.private.kennote === "1");
        if (!existing && ONLY_IMPORT_KENNOTE_EVENTS && !isKennoteEvent) continue; // 略過非 Kennote 建立的全新行程

        const mapped = mapGcalEventToNote(ev);
        if (!mapped) continue;

        if (existing) {
            // event.updated 若與我們最後一次記錄的一致，代表這是自己推送造成的回音，略過避免無限循環
            if (existing.gcal_updated === ev.updated) continue;
            ops.push(notesRef.doc(existing.id).update({
                title: mapped.title,
                content: mapped.content,
                date: mapped.date,
                allDay: mapped.allDay,
                startTime: mapped.startTime,
                endTime: mapped.endTime,
                gcal_updated: ev.updated
            }));
        } else {
            ops.push(notesRef.add({
                date: mapped.date,
                title: mapped.title,
                content: mapped.content,
                category: "",
                allDay: mapped.allDay,
                startTime: mapped.startTime,
                endTime: mapped.endTime,
                done_date: null,
                gcal_event_id: ev.id,
                gcal_updated: ev.updated
            }));
        }
    }

    if (ops.length > 0) {
        await Promise.all(ops);
        await fetchAllNotesForCache();
        loadNotesForCurrentDate();
    }
}

async function pullFromGoogleCalendar(showBanner) {
    if (!currentUserID || isSyncing) return;
    isSyncing = true;
    try {
        const token = await ensureGcalToken(false);
        if (!token) {
            if (showBanner) showSyncBanner("尚未連接 Google 日曆", "連接", () => ensureGcalToken(true));
            isSyncing = false;
            return;
        }

        let syncToken = await getStoredSyncToken();
        let pageToken = null;
        let allEvents = [];
        let newSyncToken = null;

        while (true) {
            const params = new URLSearchParams();
            params.set('singleEvents', 'true');
            params.set('maxResults', '250');
            if (pageToken) params.set('pageToken', pageToken);
            if (ONLY_IMPORT_KENNOTE_EVENTS) params.set('privateExtendedProperty', 'kennote=1');
            if (syncToken) {
                params.set('syncToken', syncToken);
            } else {
                const timeMin = new Date(); timeMin.setDate(timeMin.getDate() - 90);
                const timeMax = new Date(); timeMax.setDate(timeMax.getDate() + 365);
                params.set('timeMin', timeMin.toISOString());
                params.set('timeMax', timeMax.toISOString());
            }

            const resp = await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events?${params.toString()}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (resp.status === 410) {
                // syncToken 失效（例如太久沒同步），清空後改用全量同步重新開始
                await storeSyncToken(null);
                syncToken = null;
                pageToken = null;
                allEvents = [];
                continue;
            }
            if (!resp.ok) {
                if (resp.status === 401 && showBanner) {
                    showSyncBanner("Google 日曆連線已中斷，請重新連接", "重新連接", () => ensureGcalToken(true));
                }
                isSyncing = false;
                return;
            }

            const data = await resp.json();
            allEvents = allEvents.concat(data.items || []);
            pageToken = data.nextPageToken || null;
            if (!pageToken) { newSyncToken = data.nextSyncToken || null; break; }
        }

        await applyPulledEvents(allEvents);
        if (newSyncToken) await storeSyncToken(newSyncToken);
        hideSyncBanner();
    } catch (e) {
        console.error("從 Google Calendar 拉取失敗:", e);
    } finally {
        isSyncing = false;
    }
}

/* =============================
    身份驗證 (Authentication)
============================= */
auth.onAuthStateChanged(async (user) => {
    const loginScreen = document.getElementById("loginScreen");
    const appContent = document.getElementById("appContent");

    if (user) {
        currentUserID = user.uid;
        
        loginScreen.style.display = "none";
        appContent.style.display = "flex"; 

        const today = formatDate(new Date());
        setCurrentDateStr(today);

        initGisTokenClient();
        await ensureGcalToken(false); // 若之前已授權過，嘗試靜默取得 token

        await fetchAllNotesForCache(); 
        loadNotesForCurrentDate();

        pullFromGoogleCalendar(false);
        startPeriodicSync();
    } else {
        currentUserID = null;
        sessionStorage.removeItem('gcal_token');
        sessionStorage.removeItem('gcal_token_expiry');
        stopPeriodicSync();
        hideSyncBanner();
        
        loginScreen.style.display = "flex";
        appContent.style.display = "none";
        
        document.getElementById("noteList").innerHTML = '';
        allUserNotesCache = [];
    }
});

// Firebase 登入（不再要求 Calendar scope；Calendar 授權改由 GIS 獨立處理，可靜默刷新）

    Firestore CRUD 
============================= */
function loadNotesForCurrentDate() {
    if (!currentUserID) return;
    const targetDate = getCurrentDateStr();
    const notesToday = allUserNotesCache.filter(n => n.date === targetDate);
    renderNotes(notesToday);
}

async function fetchAllNotesForCache() {
    if (!currentUserID) return;
    try {
        const snapshot = await db.collection("users").doc(currentUserID).collection("notes").get();
        allUserNotesCache = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));

        noteDateSet.clear();
        allUserNotesCache.forEach(n => {
            if (n.date) noteDateSet.add(n.date);
        });
        renderCalendar(); 
        return allUserNotesCache;
    } catch (e) {
        console.error("Error fetching documents: ", e);
        return [];
    }
}

async function saveNoteToDB(note, docId = null) {
    if (!currentUserID) return;
    const noteRef = db.collection("users").doc(currentUserID).collection("notes");
        
    let newNoteData = { ...note };
    delete newNoteData.id;
    
    Object.keys(newNoteData).forEach(key => {
        if (newNoteData[key] === undefined) delete newNoteData[key];
    });

    try {
        let currentGcalId = newNoteData.gcal_event_id || null;
        const syncResult = await syncToGoogleCalendar(newNoteData, currentGcalId);
        if (syncResult) {
            newNoteData.gcal_event_id = syncResult.id;
            newNoteData.gcal_updated = syncResult.updated;
        }
        newNoteData.updated_at = formatDateTime(new Date());

        if (docId) {
            await noteRef.doc(docId).update(newNoteData);
        } else {
            await noteRef.add(newNoteData);
        }
        await fetchAllNotesForCache();
        loadNotesForCurrentDate();
    } catch (e) {
        console.error("Error saving document: ", e);
        alert("儲存失敗：" + e.message);
    }
}

async function deleteNote(id) {
    if (!currentUserID) return;
    try {
        if (confirm("確定刪除這筆記事？")) {
            const noteToDelete = allUserNotesCache.find(n => n.id === id);
            if (noteToDelete && noteToDelete.gcal_event_id) {
                await deleteFromGoogleCalendar(noteToDelete.gcal_event_id);
            }

            await db.collection("users").doc(currentUserID).collection("notes").doc(id).delete();
            await fetchAllNotesForCache(); 
            loadNotesForCurrentDate();
        }
    } catch (e) {
        console.error("Error deleting document: ", e);
        alert("刪除失敗：" + e.message);
    }
}

async function markNoteDone(id, done_date) {
    if (!currentUserID) return;
    try {
        await db.collection("users").doc(currentUserID).collection("notes").doc(id).update({
            done_date: done_date,
            order_index: firebase.firestore.FieldValue.delete()
        });
        await fetchAllNotesForCache(); 
        loadNotesForCurrentDate();
    } catch (e) {
        console.error("Error updating done status: ", e);
    }
}

async function moveNoteToDate(noteId, newDate) {
    if (!currentUserID) return;
    try {
        const noteToMove = allUserNotesCache.find(n => n.id === noteId);
        
        let updateData = {
            date: newDate,
            done_date: null,
            order_index: firebase.firestore.FieldValue.delete()
        };

        if (noteToMove) {
            const tempNote = { ...noteToMove, date: newDate };
            const syncResult = await syncToGoogleCalendar(tempNote, noteToMove.gcal_event_id);
            if (syncResult) {
                updateData.gcal_event_id = syncResult.id;
                updateData.gcal_updated = syncResult.updated;
            }
        }

        await db.collection("users").doc(currentUserID).collection("notes").doc(noteId).update(updateData);
        await fetchAllNotesForCache();
        loadNotesForCurrentDate();
        return true;
    } catch (e) {
        console.error("Error moving note: ", e);
        return false;
    }
}

async function copyNoteToDate(originalNote, newDate) {
    if (!currentUserID) return;
    const newNote = {
        date: newDate,
        title: originalNote.title,
        content: originalNote.content,
        category: originalNote.category,
        allDay: originalNote.allDay !== false,
        startTime: originalNote.startTime || null,
        endTime: originalNote.endTime || null,
        done_date: null,
    };
    
    try {
        const syncResult = await syncToGoogleCalendar(newNote);
        if (syncResult) {
            newNote.gcal_event_id = syncResult.id;
            newNote.gcal_updated = syncResult.updated;
        }
        newNote.updated_at = formatDateTime(new Date());

        await db.collection("users").doc(currentUserID).collection("notes").add(newNote);
        await fetchAllNotesForCache();
        loadNotesForCurrentDate();
        return true;
    } catch (e) {
        console.error("Error copying note: ", e);
        return false;
    }
}

async function saveNoteOrder(id, index) {
    if (!currentUserID) return;
    try {
        await db.collection("users").doc(currentUserID).collection("notes").doc(id).update({
            order_index: index
        });
    } catch(e) {
        console.error("Error saving order: ", e);
    }
}

function truncateTitle(title) {  return title.length > 10 ? title.slice(0, 10) + "…" : title;}     
function formatDate(date) {  const y = date.getFullYear();  const m = String(date.getMonth() + 1).padStart(2, "0");  const d = String(date.getDate()).padStart(2, "0");  return `${y}-${m}-${d}`;}   
function formatTime(date) {  const h = String(date.getHours()).padStart(2, "0");  const m = String(date.getMinutes()).padStart(2, "0");  const s = String(date.getSeconds()).padStart(2, "0");  return `${h}:${m}:${s}`;}    
function formatDateTime(date) {  return `${formatDate(date)} ${formatTime(date)}`;}
function formatHM(date) {  const h = String(date.getHours()).padStart(2, "0");  const m = String(date.getMinutes()).padStart(2, "0");  return `${h}:${m}`;}

function getCurrentDateStr() {  return document.getElementById("currentDate").value;}
function setCurrentDateStr(str) {  document.getElementById("currentDate").value = str;  document.getElementById("currentDateText").textContent = str;}

const CATEGORIES = ["", "私人", "工作"];

function getCategoryColor(category) {
    const colors = {
        "": "#ffffff",      
        "私人": "#8B5E34",   
        "工作": "#4A5568",   
        "學習": "#9C27B0"  
    };
    return colors[category] || "#1b1b1b"; 
}

function getCategoryTextColor(category) {
    if (category === "") return "#1b1b1b";
    return "white";
}

function renderCategoryTags(currentCategory) {
    const container = document.getElementById("noteCategoryTags");
    if (!container) return;
    container.innerHTML = ''; 

    CATEGORIES.forEach(category => {
        const btn = document.createElement("button");
        btn.textContent = category || "不分類"; 
        btn.className = "nt-btn tag-btn"; 
        btn.dataset.category = category;

        const defaultBg = "#ffffff";
        const defaultText = "#1b1b1b";
        const categoryBg = getCategoryColor(category);
        const categoryText = getCategoryTextColor(category);

        const applyDefaultStyle = (element) => {
            element.style.backgroundColor = defaultBg;
            element.style.color = defaultText;
            element.style.border = '1px solid #E2E8F0';
            element.style.opacity = '1';
            element.style.transition = '0.2s';
            element.style.outline = 'none';
        };

        const applyActiveStyle = (element) => {
            element.style.backgroundColor = categoryBg;
            element.style.color = categoryText;
            element.style.outline = `2px solid ${categoryText}`; 
        }
        
        const applyHoverStyle = (element, cat) => {
            if (cat === "") {
                element.style.backgroundColor = '#1b1b1b';
                element.style.color = 'white';
                element.style.border = '1px solid #1b1b1b';
            } else {
                element.style.backgroundColor = categoryBg;
                element.style.color = categoryText;
                element.style.border = `1px solid ${categoryBg}`;
            }
        }

        applyDefaultStyle(btn);

        if (category === currentCategory) {
            btn.classList.add("active");
            applyActiveStyle(btn);
        } 
        
        btn.onmouseenter = () => {
            if (!btn.classList.contains('active')) applyHoverStyle(btn, category);
        };

        btn.onmouseleave = () => {
            if (!btn.classList.contains('active')) applyDefaultStyle(btn);
            else applyActiveStyle(btn);
        };

        btn.onclick = (e) => {
            e.preventDefault(); 
            container.querySelectorAll('.tag-btn').forEach(b => {
                b.classList.remove('active');
                applyDefaultStyle(b);
            });
            btn.classList.add('active');
            applyActiveStyle(btn);
        };
        container.appendChild(btn);
    });
}

function renderNotes(notesArr) {
    if (currentFilter) {
        notesArr = notesArr.filter(n => n.category === currentFilter);
    }
    const listEl = document.getElementById("noteList");
    listEl.innerHTML = ""; 

    const fragment = document.createDocumentFragment();
    const undone = notesArr.filter(n => !n.done_date);
    const done   = notesArr.filter(n => n.done_date);

    undone.sort((a, b) => (a.order_index ?? 99999) - (b.order_index ?? 99999));

    ([...undone, ...done]).forEach(note => {
        const item = document.createElement("div");
        item.className = "note-item";
        if (note.done_date) item.classList.add("completed"); 
        item.dataset.id = note.id; 

        const isDone = !!note.done_date;
        const doneTagHtml = isDone 
            ? `<span class="done-date">✔ ${note.done_date}</span>` 
            : '';
            
        const bgColor = getCategoryColor(note.category);
        const textColor = getCategoryTextColor(note.category);
        
        const categoryTagHtml = note.category 
            ? `<div class="note-category-tag" style="background:${bgColor}; color: ${textColor};">${note.category}</div>` 
            : '';

        const timeHtml = (note.allDay === false && note.startTime)
            ? `<span class="note-time">${note.startTime}${note.endTime ? '–' + note.endTime : ''}</span>`
            : '';
        
        const noteForCopy = JSON.stringify(note).replace(/"/g, '&quot;');
        
        item.innerHTML = `
            <input type="checkbox" class="note-checkbox" data-note-id="${note.id}" ${isDone ? 'checked' : ''}>
            <div class="note-title">
                ${timeHtml}
                <span class="title-text ${isDone ? 'done' : ''}">${truncateTitle(note.title || "(無標題)")}</span>
                ${doneTagHtml}
            </div>
            ${categoryTagHtml}
            <div class="note-actions">
                <button class="nt-btn icon-btn" title="點擊選擇要搬移的日期" onclick="event.stopPropagation(); startMoveMode('${note.id}')">
                    <img src="icon/move.png" alt="move">
                </button>
                <button class="nt-btn icon-btn" title="點擊選擇要複製的日期" onclick="event.stopPropagation(); startCopyMode('${noteForCopy}')">
                    <img src="icon/copy.png" alt="copy">
                </button>
                <button class="nt-btn nt-danger icon-btn" ondblclick="event.stopPropagation(); deleteNote('${note.id}')">
                    <img src="icon/round.png" alt="刪除">
                </button>
            </div>
        `;
        
        const chk = item.querySelector(".note-checkbox");
        if (chk) {
            chk.addEventListener('click', (ev) => {
                ev.stopPropagation();
                const doneDate = chk.checked ? formatDateTime(new Date()) : null;
                markNoteDone(note.id, doneDate);
            });
        }

        const titleEl = item.querySelector(".note-title");
        if(titleEl) {
             titleEl.addEventListener('click', () => openNoteModal(note));
        }

        fragment.appendChild(item);
    });
    
    listEl.appendChild(fragment);
    initSortable(); 
}

function openNoteModal(note) {
    editingId = note ? note.id : null;
    document.getElementById("noteModalHeader").textContent = note ? "編輯記事" : "新增記事";
    document.getElementById("noteTitleInput").value = note?.title || "";
    document.getElementById("noteContentInput").value = note?.content || "";

    document.getElementById("noteAllDayInput").checked = isAllDay;
    document.getElementById("noteStartTimeInput").value = note?.startTime || "09:00";

    document.getElementById("noteTimeSeparator").style.display = isAllDay ? "none" : "inline";
    document.getElementById("noteEndTimeInput").style.display = isAllDay ? "none" : "inline-block";

    document.querySelectorAll(".modal-field-label").forEach(el => el.style.display = "");
    document.getElementById("noteTitleInput").style.display = "";
    document.getElementById("noteContentInput").style.display = "";
    document.getElementById("noteModalSave").style.display = "";
    
    document.querySelector(".modal-field-row-new").style.display = "flex"; 
    document.getElementById("noteCategoryTags").style.display = "flex";
    document.querySelector(".time-toggle-row").style.display = "flex";

}

function closeNoteModal() {
    document.getElementById("noteModal").style.display = "none";
}

async function handleSaveNote() {
    const title = document.getElementById("noteTitleInput").value.trim();
    const content = document.getElementById("noteContentInput").value.trim();
    
    const activeTag = document.querySelector("#noteCategoryTags .active");
    const category = activeTag ? activeTag.dataset.category : "";
    const dateStr = getCurrentDateStr();

    const allDay = document.getElementById("noteAllDayInput").checked;
    let startTime = null, endTime = null;
    if (!allDay) {
        startTime = document.getElementById("noteStartTimeInput").value || "09:00";
        endTime = document.getElementById("noteEndTimeInput").value || startTime;
        if (endTime <= startTime) {
            const [h, m] = startTime.split(":").map(Number);
            const endD = new Date();
            endD.setHours(h + 1, m, 0, 0);
            endTime = formatHM(endD);
        }
    }

    if (!title && !content) return closeNoteModal();

    const noteData = { 
        date: dateStr, 
        title, 
        content, 
        category,
        allDay,
        startTime,
        endTime,
        done_date: null 
    };

    if (!editingId) {
        await saveNoteToDB(noteData);
    } else {
        const oldNote = allUserNotesCache.find(n => n.id === editingId);
        if (oldNote) {
            noteData.done_date = oldNote.done_date || null; 
            noteData.order_index = oldNote.order_index;
            noteData.gcal_event_id = oldNote.gcal_event_id; 
            await saveNoteToDB(noteData, editingId);
        }
    }
    closeNoteModal();
}

/* =============================   月曆相關與跨月事件綁定 ============================= */
function reapplyMoveCopyHandlers() {
    const cells = document.querySelectorAll("#calendarGrid .calendar-cell");
    cells.forEach(cell => {
        if (targetNoteForCopy) {
            cell.style.cursor = "copy";
            cell.onclick = async function () {
                const newDate = this.dataset.date;
                await copyNoteToDate(targetNoteForCopy, newDate);
                targetNoteForCopy = null;
                closeCalendarModal();
                removeMoveHint();
                if (newDate === getCurrentDateStr()) loadNotesForCurrentDate();
            };
        } else if (targetNoteForMove) {
            cell.style.cursor = "pointer";
            cell.onclick = async function () {
                const newDate = this.dataset.date;
                await moveNoteToDate(targetNoteForMove.id, newDate);
                targetNoteForMove = null;
                closeCalendarModal();
                removeMoveHint();
            };
        }
    });
}

function buildTagBubblesHtml(dateStr) {
    const notesOfDay = allUserNotesCache.filter(n => n.date === dateStr && !n.done_date);
    if (notesOfDay.length === 0) return '';

    const grouped = {};
    let hasUncategorized = false;
    notesOfDay.forEach(n => {
        if (n.category) {
            if (!grouped[n.category]) grouped[n.category] = [];
            grouped[n.category].push(n);
        } else {
            hasUncategorized = true;
        }
    });

    let html = hasUncategorized ? '<div class="calendar-dot"></div>' : '';

    Object.keys(grouped).forEach(cat => {
        const notesInCat = grouped[cat];
        const bg = getCategoryColor(cat);
        const color = getCategoryTextColor(cat);

        let label;
        if (notesInCat.length === 1) {
            const n0 = notesInCat[0];
            const rawTitle = n0.title || cat;
            const timePrefix = (n0.allDay === false && n0.startTime) ? `${n0.startTime} ` : '';
            const trimmedTitle = rawTitle.length > 6 ? rawTitle.slice(0, 6) + "…" : rawTitle;
            label = timePrefix + trimmedTitle;
        } else {
            label = `${cat}×${notesInCat.length}`;
        }

        html += `<div class="note-category-tag" style="position:static;display:block;max-width:92%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;box-sizing:border-box;background:${bg};color:${color};margin-top:2px;">${label}</div>`;
    });

    return html;
}

function renderCalendar() {
    const grid = document.getElementById("calendarGrid");
    grid.innerHTML = "";

    const year = calendarMonth.getFullYear();
    const month = calendarMonth.getMonth();
    document.getElementById("calTitle").textContent = `${year} 年 ${month + 1} 月`;

    const firstDay = new Date(year, month, 1);
    const firstWeekday = firstDay.getDay();
    const nextMonthFirst = new Date(year, month + 1, 1);
    const daysInMonth = new Date(nextMonthFirst - 1).getDate();
    const daysInPrevMonth = new Date(year, month, 0).getDate();

    const selectedDateStr = getCurrentDateStr();
    const todayStr = formatDate(new Date());

    for (let i = 0; i < 42; i++) {
        const cell = document.createElement("div");
        cell.className = "calendar-cell";
        const inner = document.createElement("div");
        inner.className = "calendar-cell-inner";

        let dateNum, offset;
        if (i < firstWeekday) {
            dateNum = daysInPrevMonth - firstWeekday + 1 + i;
            offset = -1;
            cell.classList.add("other-month");
        } else if (i >= firstWeekday + daysInMonth) {
            dateNum = i - (firstWeekday + daysInMonth) + 1;
            offset = 1;
            cell.classList.add("other-month");
        } else {
            dateNum = i - firstWeekday + 1;
            offset = 0;
        }

        const cellDate = new Date(year, month + offset, dateNum);
        const cellDateStr = formatDate(cellDate);

        inner.innerHTML = `<div class="calendar-cell-num">${dateNum}</div>`;
        if (cellDateStr === todayStr) cell.classList.add("today");
        
        if (noteDateSet.has(cellDateStr)) cell.classList.add("has-note");

        inner.innerHTML += buildTagBubblesHtml(cellDateStr);
        
        if (cellDateStr === selectedDateStr) cell.classList.add("selected");

        cell.dataset.date = cellDateStr;
        cell.onclick = () => {
            setCurrentDateStr(cellDateStr);
            loadNotesForCurrentDate();
            closeCalendarModal();
        };

        cell.appendChild(inner);
        grid.appendChild(cell);
    }
    
    if (targetNoteForMove || targetNoteForCopy) {
        reapplyMoveCopyHandlers();
    }
}

function openCalendarModal() {
    document.getElementById("calendarModal").style.display = "flex";
    renderCalendar();
}
function closeCalendarModal() {
    document.getElementById("calendarModal").style.display = "none";
}
function shiftCalendarMonth(offset) {
    calendarMonth.setMonth(calendarMonth.getMonth() + offset);
    renderCalendar();
}

window.onload = () => {
    document.querySelectorAll("#filterBar button").forEach(btn => {
        btn.onclick = () => {
            currentFilter = btn.dataset.filter; 
            document.querySelectorAll("#filterBar button").forEach(b => b.classList.remove("active"));

        };

    document.getElementById("calNext").onclick = () => shiftCalendarMonth(1);
    document.getElementById("btnAdd").onclick = () => openNoteModal(null);
    document.getElementById("noteModalCancel").onclick = closeNoteModal;
    document.getElementById("noteModalSave").onclick = handleSaveNote;
    document.getElementById("btnSyncNow").onclick = () => pullFromGoogleCalendar(true);

    document.getElementById("noteAllDayInput").addEventListener("change", (e) => {
        const showTime = !e.target.checked;
        document.getElementById("noteStartTimeInput").style.display = showTime ? "inline-block" : "none";
        document.getElementById("noteTimeSeparator").style.display = showTime ? "inline" : "none";
        document.getElementById("noteEndTimeInput").style.display = showTime ? "inline-block" : "none";
    });
    
    document.getElementById("btnPrevDay").onclick = (e) => {
        e.stopPropagation();
        const cur = new Date(getCurrentDateStr());
        cur.setDate(cur.getDate() - 1);
        setCurrentDateStr(formatDate(cur));
        loadNotesForCurrentDate();
    };

    document.getElementById("btnNextDay").onclick = (e) => {
        e.stopPropagation();
        const cur = new Date(getCurrentDateStr());
        cur.setDate(cur.getDate() + 1);
        setCurrentDateStr(formatDate(cur));
        loadNotesForCurrentDate();
    };  
    
    document.getElementById("btnToday").onclick = (ev) => {
        ev.stopPropagation();          
        const today = formatDate(new Date());
        setCurrentDateStr(today);
        loadNotesForCurrentDate();      
    };
    
    document.getElementById("btnMoveUndoneToToday").onclick = async () => {
        if (!currentUserID) return alert("請先登入");

        const targetDate = getCurrentDateStr();
        const todayStr = formatDate(new Date());

        if (targetDate === todayStr) return alert("目前已經是今日的記事囉！");

        const undoneElements = document.querySelectorAll("#noteList .note-item:not(.completed)");
        if (undoneElements.length === 0) return alert("畫面上沒有未完成的項目可移動！");

        if (!confirm(`確定要將畫面上 ${undoneElements.length} 個未完成項目延至今日 (${todayStr}) 嗎？`)) return;

        const movePromises = Array.from(undoneElements).map(async (el) => {
            const id = el.dataset.id;
            const noteToMove = allUserNotesCache.find(n => n.id === id);

            let extra = {
                date: todayStr,
                order_index: firebase.firestore.FieldValue.delete()
            };

            if (noteToMove) {
                const tempNote = { ...noteToMove, date: todayStr };
                const syncResult = await syncToGoogleCalendar(tempNote, noteToMove.gcal_event_id);
                if (syncResult) {
                    extra.gcal_event_id = syncResult.id;
                    extra.gcal_updated = syncResult.updated;
                }
            }

            return db.collection("users").doc(currentUserID).collection("notes").doc(id).update(extra);
        });

        try {
            await Promise.all(movePromises);  
            await fetchAllNotesForCache();    
            loadNotesForCurrentDate();        
        } catch (e) {
            console.error("Error batch moving notes to today: ", e);
            alert("移動失敗：" + e.message);
        }
    };

    ["calendarModal"].forEach(id => {
        const modal = document.getElementById(id);
        if (modal) {
            modal.addEventListener("click", (ev) => {
                if (ev.target === modal) {
                    const sr = document.getElementById("searchResultArea");
                    if (sr) sr.remove();

                    document.querySelectorAll(".modal-field-label").forEach(el => el.style.display = "");
                    document.querySelector(".modal-field-row-new").style.display = "flex";
                    document.getElementById("noteTitleInput").style.display = "";
                    document.getElementById("noteContentInput").style.display = "";
                    document.getElementById("noteModalSave").style.display = "";
                    document.getElementById("noteCategoryTags").style.display = "flex";
                    document.querySelector(".time-toggle-row").style.display = "flex";
                    
                    const oldRow = document.querySelector(".modal-field-row");
                    if (oldRow) oldRow.style.display = "none";

                    modal.style.display = "none";
                }
            });
        }
    });
};

document.getElementById("btnSearch").onclick = async () => {
    if (!currentUserID) return alert("請先登入");
    const kw = prompt("請輸入搜尋關鍵字：");
    if (!kw) return;

    const notes = allUserNotesCache;
    const keyword = kw.toLowerCase(); 
    
    const searchResults = notes.filter(note => {
        const title = (note.title || "").toLowerCase();
        const content = (note.content || "").toLowerCase();
        return title.includes(keyword) || content.includes(keyword);
    });

    if (searchResults.length === 0) return alert("查無資料！");

    const rows = searchResults.map(n => [
        n.id, 
        n.date, 
        n.title, 
        n.content, 
        n.done_date 
    ]);

    showSearchResults(rows);
};

function showSearchResults(rows) {
    const modal = document.getElementById("noteModal");
    modal.style.display = "flex";

    const existingArea = document.getElementById("searchResultArea");
    if (existingArea) existingArea.remove();

    document.getElementById("noteModalHeader").textContent = `搜尋結果（${rows.length}筆）`;

    document.querySelectorAll(".modal-field-label").forEach(el => el.style.display = "none");
    document.getElementById("noteTitleInput").style.display = "none";
    document.getElementById("noteContentInput").style.display = "none";
    document.getElementById("noteModalSave").style.display = "none";
    
    document.querySelector(".modal-field-row-new").style.display = "none"; 
    document.getElementById("noteCategoryTags").style.display = "none";
    document.querySelector(".time-toggle-row").style.display = "none";

    const tempArea = document.createElement("div");
    tempArea.id = "searchResultArea";
    tempArea.style.maxHeight = "60vh";
    tempArea.style.overflowY = "auto";
    
    tempArea.innerHTML = `
        <style>
            .search-table { width:100%; border-collapse:separate; border-spacing: 0 8px; }
            .search-table th { font-weight: bold; color: #A0AEC0; padding: 12px 15px; text-align: left; border-bottom: 2px solid #E2E8F0; position: sticky; top: 0; background-color: #fff; z-index: 10; }
            .search-row { cursor: pointer; background-color: #F7FAFC; transition: background-color 0.2s; border-radius: 8px; overflow: hidden; }
            .search-row:hover { background-color: #EDF2F7; }
            .search-row td { padding: 10px 15px; border-top: 1px solid #E2E8F0; }
            .search-row:first-child td { border-top: none; }
            .search-row.completed-row { opacity: 0.6; }
            .search-title { font-weight: 500; }
            .search-date { font-size: 0.9em; color: #4A5568; }
            .search-done { color: #38A169; font-weight: bold; text-align: center; }
        </style>
        <table class="search-table">
            <thead>
                <tr><th>日期</th><th>標題</th><th style="width: 50px; text-align: center;">完成</th></tr>
            </thead>
            <tbody>
                ${rows.map(r => {
                    const id = r[0]; const date = r[1]; const title = r[2] || '(無標題)'; const isDone = r[4]; 
                    return `
                        <tr class="search-row ${isDone ? 'completed-row' : ''}" data-id="${id}">
                            <td class="search-date">${date}</td>
                            <td class="search-title">${truncateTitle(title)}</td>
                            <td class="search-done">${isDone ? '✔' : ''}</td>
                        </tr>
                    `;
                }).join('')}
            </tbody>
        </table>
    `;

    const modalContent = document.querySelector(".modal-content");
    const modalFooter = document.querySelector(".modal-footer");
    modalContent.insertBefore(tempArea, modalFooter);

    document.querySelectorAll(".search-row").forEach(tr => {
        tr.onclick = () => {
            const id = tr.dataset.id;
            openEditFromSearch(id);
        };
    });
}

function openEditFromSearch(id) {
    const note = allUserNotesCache.find(n => n.id === id);
    if (note) {
        const sr = document.getElementById("searchResultArea");
        if (sr) sr.remove();

        document.querySelectorAll(".modal-field-label").forEach(el => el.style.display = "");
        document.querySelector(".modal-field-row-new").style.display = "flex";
        document.getElementById("noteTitleInput").style.display = "";
        document.getElementById("noteContentInput").style.display = "";
        document.getElementById("noteModalSave").style.display = "";
        document.getElementById("noteCategoryTags").style.display = "flex";
        document.querySelector(".time-toggle-row").style.display = "flex";

        openNoteModal(note);    
    }
}

let sortable = null;
function initSortable() {
    const list = document.getElementById("noteList");
    if (sortable && typeof sortable.destroy === 'function') sortable.destroy(); 

    sortable = new Sortable(list, {
        animation: 150,
        ghostClass: "dragging",
        filter: ".completed",
        preventOnFilter: false,
        handle: ".note-category-tag",
        
        onEnd: async function (evt) { 
            if (evt.oldIndex === evt.newIndex) return;
            const undoneItems = Array.from(list.children).filter(el => !el.classList.contains("completed"));
            const updatePromises = undoneItems.map((el, index) => {
                const id = el.dataset.id;
                return saveNoteOrder(id, index); 
            });
            await Promise.all(updatePromises);
            await fetchAllNotesForCache(); 
            loadNotesForCurrentDate();
        }
    });
}

let targetNoteForMove = null;
let targetNoteForCopy = null;

function removeMoveHint() {
    const hint = document.getElementById("moveHint");
    if (hint) hint.remove();
}

function startCopyMode(noteString) {
    try {
        targetNoteForCopy = JSON.parse(noteString.replace(/&quot;/g, '"'));
    } catch (e) {
        return;
    }
    targetNoteForMove = null;
    removeMoveHint();
    openCalendarModal();

    const hint = document.createElement("div");
    hint.id = "moveHint";
    hint.textContent = "請選擇要複製到的日期";
    hint.style.cssText = `position:fixed;top:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.92);color:#fff;padding:12px 22px;border-radius:30px;z-index:9999;font-size:15px;pointer-events:none;box-shadow:0 4px 20px rgba(0,0,0,0.4);`;
    document.body.appendChild(hint);
    reapplyMoveCopyHandlers();
}    

function startMoveMode(noteId) {
    targetNoteForMove = { id: noteId };
    targetNoteForCopy = null;
    removeMoveHint();
    openCalendarModal();

    const hint = document.createElement("div");
    hint.id = "moveHint";
    hint.textContent = "請選擇要搬移的日期";
    hint.style.cssText = `position:fixed;top:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.92);color:#fff;padding:12px 22px;border-radius:30px;z-index:9999;font-size:15px;pointer-events:none;box-shadow:0 4px 20px rgba(0,0,0,0.4);`;
    document.body.appendChild(hint);
    reapplyMoveCopyHandlers();
}

const originalClose = closeCalendarModal;
closeCalendarModal = function () {
    const inMoveOrCopyMode = targetNoteForMove || targetNoteForCopy;
    originalClose(); 
    if (inMoveOrCopyMode) {
        targetNoteForMove = null;
        targetNoteForCopy = null;
        removeMoveHint();
        renderCalendar();
    }
};
</script>
</body>
</html>
